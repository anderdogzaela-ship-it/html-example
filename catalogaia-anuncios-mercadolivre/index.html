<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CatalogaIA · Automação de Anúncios Mercado Livre</title>
<style>
:root{
  --bg:#09090c;
  --bg-2:#0c0c10;
  --surface:#141318;
  --surface-2:#1b1a20;
  --surface-3:#25232b;
  --surface-4:#302d37;
  --border:rgba(255,224,140,0.08);
  --border-strong:rgba(255,224,140,0.17);

  --text:#f4f2ec;
  --text-soft:#c6c2b8;
  --text-muted:#8a8578;
  --text-dim:#59564c;

  --gold:#f0bd3e;
  --gold-soft:rgba(240,189,62,0.14);
  --gold-glow:rgba(240,189,62,0.4);
  --blue:#5b9bd5;
  --violet:#a78bfa;
  --violet-soft:rgba(167,139,250,0.14);
  --green:#4ade80;
  --green-soft:rgba(74,222,128,0.13);
  --red:#f0525a;
  --red-soft:rgba(240,82,90,0.13);
  --orange:#f59e0b;
  --orange-soft:rgba(245,158,11,0.14);

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;
  --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
  --font:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font);
  background:
    radial-gradient(1200px 600px at 12% -10%, rgba(240,189,62,0.06), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(167,139,250,0.055), transparent 55%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold-soft);}
svg.i{width:1em;height:1em;display:inline-block;vertical-align:-0.14em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.app{display:flex;flex-direction:column;min-height:100vh;}

/* ---------- Topbar ---------- */
.topbar{
  display:flex;align-items:center;gap:var(--s5);
  padding:12px var(--s6);
  background:linear-gradient(180deg, rgba(20,19,24,0.98), rgba(12,12,16,0.98));
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:0.2px;}
.brand .mark{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(145deg,var(--gold),#b9800f);
  display:flex;align-items:center;justify-content:center;
  color:#1c1305;font-size:15px;box-shadow:0 0 0 1px rgba(0,0,0,0.3), 0 4px 14px rgba(240,189,62,0.32);
}
.brand small{display:block;font-weight:500;font-size:10.5px;color:var(--text-muted);letter-spacing:0.4px;text-transform:uppercase;}

.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:4px;margin-left:var(--s4);flex-wrap:wrap;}
.nav button{
  border:none;background:transparent;color:var(--text-muted);
  font-family:var(--font);font-weight:600;font-size:13px;
  padding:8px 14px;border-radius:8px;cursor:pointer;
  display:flex;align-items:center;gap:7px;transition:.15s;
}
.nav button svg{font-size:13px;}
.nav button:hover{color:var(--text-soft);}
.nav button.active{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--border-strong);}

.topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;}

.status-pill{
  display:flex;align-items:center;gap:8px;
  padding:7px 12px;border-radius:20px;
  background:var(--surface-2);border:1px solid var(--border);
  font-size:12.5px;font-weight:600;color:var(--text-soft);
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);}
.status-pill.online{color:var(--green);}
.status-pill.online .dot{background:var(--green);box-shadow:0 0 8px rgba(74,222,128,0.7);animation:pulse 1.6s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,0.5);}70%{box-shadow:0 0 0 7px rgba(74,222,128,0);}100%{box-shadow:0 0 0 0 rgba(74,222,128,0);}}

.icon-btn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text-soft);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:14px;transition:.15s;
}
.icon-btn:hover{background:var(--surface-3);color:var(--text);}

/* ---------- Views ---------- */
main{flex:1;padding:var(--s6);max-width:1440px;margin:0 auto;width:100%;}
.view{display:none;animation:fadeIn .35s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.card{
  background:linear-gradient(180deg, var(--surface), var(--surface-2));
  border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:var(--s5);
}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4);gap:10px;flex-wrap:wrap;}
.card-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);display:flex;align-items:center;gap:8px;}
.card-title svg{color:var(--gold);}
.section-gap{margin-bottom:var(--s5);}

.btn{
  font-family:var(--font);font-weight:700;font-size:13.5px;
  padding:11px 18px;border-radius:10px;border:1px solid var(--border-strong);
  background:var(--surface-3);color:var(--text);cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;transition:.15s;
}
.btn:hover{background:var(--surface-4);}
.btn.primary{background:linear-gradient(145deg,var(--gold),#c8850f);color:#1c1305;border:none;box-shadow:0 4px 16px rgba(240,189,62,0.24);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.danger{background:rgba(240,82,90,0.12);color:#ff9498;border-color:rgba(240,82,90,0.3);}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:0.38;cursor:not-allowed;}
.btn.sm{padding:8px 12px;font-size:12.5px;}

/* ---------- Dashboard ---------- */
.hero-banner{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s5);flex-wrap:wrap;
  background:linear-gradient(120deg, rgba(240,189,62,0.12), rgba(167,139,250,0.07));
  border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  padding:var(--s5) var(--s6);margin-bottom:var(--s5);
}
.hero-banner .num{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--gold);}
.hero-banner .lbl{font-size:13px;color:var(--text-soft);margin-top:4px;}
.hero-trend{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--green);background:var(--green-soft);padding:7px 12px;border-radius:20px;}

.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s4);margin-bottom:var(--s5);}
@media (max-width:1180px){.kpi-row{grid-template-columns:repeat(3,1fr);}}
@media (max-width:720px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
.kpi-card{background:linear-gradient(180deg, var(--surface), var(--surface-2));border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--s4);}
.kpi-card .lbl{font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.4px;display:flex;align-items:center;gap:6px;}
.kpi-card .val{font-family:var(--mono);font-size:27px;font-weight:700;margin-top:8px;}
.kpi-card .val small{font-size:14px;color:var(--text-muted);font-weight:500;}
.kpi-card.c-blue .val{color:var(--blue);}
.kpi-card.c-green .val{color:var(--green);}
.kpi-card.c-orange .val{color:var(--orange);}
.kpi-card.c-gold .val{color:var(--gold);}
.kpi-card.c-violet .val{color:var(--violet);}

.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:var(--s5);align-items:start;}
@media (max-width:1080px){.dash-grid{grid-template-columns:1fr;}}

.bars{display:flex;align-items:flex-end;gap:8px;height:200px;padding:0 4px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.bar-col .num{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);}
.bar-col .fill{width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--gold),rgba(240,189,62,0.35));min-height:4px;transition:height .6s cubic-bezier(.2,.8,.2,1);}
.bar-col .day{font-size:10px;color:var(--text-dim);margin-top:2px;}

.activity-list{display:flex;flex-direction:column;gap:9px;max-height:420px;overflow-y:auto;}
.activity-row{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;padding:10px 11px;background:var(--surface-2);border-radius:9px;border:1px solid var(--border);}
.activity-row svg{margin-top:2px;flex-shrink:0;}
.activity-row .txt{flex:1;color:var(--text-soft);line-height:1.4;}
.activity-row .txt b{color:var(--text);font-family:var(--mono);font-weight:700;}
.activity-row .t{font-size:10.5px;color:var(--text-dim);white-space:nowrap;}

/* ---------- Import ---------- */
.upload-dropzone{
  border:1.5px dashed var(--border-strong);border-radius:var(--radius-lg);
  padding:var(--s8) var(--s6);text-align:center;cursor:pointer;transition:.2s;
  background:var(--surface-2);
}
.upload-dropzone:hover{border-color:var(--gold);background:var(--surface-3);}
.upload-dropzone svg{font-size:30px;color:var(--gold);margin-bottom:12px;}
.upload-dropzone .t1{font-size:15px;font-weight:700;}
.upload-dropzone .t2{font-size:12.5px;color:var(--text-muted);margin-top:6px;}

.file-chip{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;margin-top:var(--s4);}
.file-chip svg{font-size:20px;color:var(--gold);}
.file-chip .n{font-weight:700;font-size:13.5px;}
.file-chip .m{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

.progress-bar{height:8px;border-radius:5px;background:var(--surface-4);overflow:hidden;margin-top:var(--s4);}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),#c8850f);transition:width .1s linear;}

table.map-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:var(--s4);}
table.map-table th{text-align:left;padding:9px 10px;color:var(--text-muted);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:0.4px;border-bottom:1px solid var(--border);}
table.map-table td{padding:10px 10px;border-bottom:1px solid var(--border);color:var(--text-soft);}
table.map-table td.col-name{font-family:var(--mono);color:var(--gold);}
table.map-table select{
  width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);font-family:var(--font);font-size:12.5px;outline:none;
}
table.map-table tr:last-child td{border-bottom:none;}

.import-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5);align-items:start;}
@media (max-width:980px){.import-grid{grid-template-columns:1fr;}}

.success-panel{text-align:center;padding:var(--s8) var(--s5);}
.success-panel svg{font-size:44px;color:var(--green);margin-bottom:14px;}
.success-panel .t1{font-size:19px;font-weight:700;}
.success-panel .t2{font-size:13px;color:var(--text-muted);margin-top:8px;}

/* ---------- Pipeline (kanban) ---------- */
.pipeline-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:var(--s5);flex-wrap:wrap;}
.pipeline-toolbar .spacer{flex:1;}
.kanban-board{display:flex;gap:var(--s4);overflow-x:auto;padding-bottom:8px;}
.kanban-col{flex:1;min-width:230px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--s3);display:flex;flex-direction:column;}
.kanban-col-head{display:flex;align-items:center;gap:8px;padding:6px 6px 12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-muted);}
.kanban-col-head svg{color:var(--gold);}
.kanban-col.st-pendente .kanban-col-head svg{color:var(--orange);}
.kanban-col.st-publicado .kanban-col-head svg{color:var(--green);}
.kanban-count{margin-left:auto;background:var(--surface-4);color:var(--text-soft);border-radius:20px;padding:2px 9px;font-size:11px;font-family:var(--mono);}
.kanban-cards{display:flex;flex-direction:column;gap:9px;min-height:60px;}
.kcard{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;cursor:pointer;transition:.15s;animation:fadeIn .3s ease;}
.kcard:hover{border-color:var(--border-strong);transform:translateY(-1px);}
.kcard .sku{font-family:var(--mono);font-size:10.5px;color:var(--gold);font-weight:700;}
.kcard .name{font-size:12.5px;font-weight:600;margin-top:4px;line-height:1.35;}
.kcard .meta{font-size:10.5px;color:var(--text-muted);margin-top:6px;}
.kcard .reason{font-size:10.5px;color:var(--orange);margin-top:7px;background:var(--orange-soft);padding:5px 8px;border-radius:6px;line-height:1.4;}
.kcard .qbadge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-family:var(--mono);color:var(--green);margin-top:7px;font-weight:700;}
.kcard-check{float:right;width:15px;height:15px;}
.kanban-empty{font-size:11.5px;color:var(--text-dim);text-align:center;padding:16px 4px;}

/* ---------- Anuncio (listing) ---------- */
.anuncio-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:var(--s5);flex-wrap:wrap;}
.anuncio-toolbar select{
  padding:10px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);font-family:var(--font);font-weight:600;font-size:13px;outline:none;min-width:280px;
}
.status-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:9px;font-weight:700;font-size:12px;}
.status-badge.st-publicado{background:var(--green-soft);color:var(--green);}
.status-badge.st-revisao{background:var(--violet-soft);color:var(--violet);}
.status-badge.st-geracao{background:var(--gold-soft);color:var(--gold);}
.status-badge.st-pendente{background:var(--orange-soft);color:var(--orange);}

.listing-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:var(--s5);align-items:start;}
@media (max-width:1080px){.listing-grid{grid-template-columns:1fr;}}

.breadcrumb{font-size:12px;color:var(--text-muted);margin-bottom:10px;}
.breadcrumb b{color:var(--text-soft);}
.listing-title{font-size:19px;font-weight:700;line-height:1.35;margin-bottom:14px;}

.attr-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--s5);}
.attr-chip{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:12px;}
.attr-chip b{color:var(--text-soft);font-weight:700;}
.attr-chip .k{color:var(--text-muted);margin-right:5px;}

table.spec-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:var(--s5);}
table.spec-table td{padding:9px 4px;border-bottom:1px solid var(--border);}
table.spec-table td:first-child{color:var(--text-muted);width:44%;}
table.spec-table td:last-child{color:var(--text-soft);font-weight:600;}
table.spec-table tr:last-child td{border-bottom:none;}

.desc-block{font-size:13px;line-height:1.7;color:var(--text-soft);white-space:pre-line;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--s4);margin-bottom:var(--s5);}

.gauge-row{display:flex;align-items:center;gap:16px;margin-bottom:var(--s4);}
.gauge{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
.gauge::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface-2);}
.gauge b{position:relative;font-family:var(--mono);font-size:19px;}
.gauge-meta .l{font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.4px;}
.gauge-meta .v{font-size:12.5px;color:var(--green);margin-top:4px;display:flex;align-items:center;gap:5px;}

.compare-item{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;margin-bottom:10px;}
.compare-item .t{font-size:12.5px;font-weight:600;line-height:1.35;}
.compare-item .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:11px;color:var(--text-muted);}
.compare-item .rep{color:var(--gold);font-weight:700;}
.compare-item .price{color:var(--text);font-family:var(--mono);font-weight:700;}
.pattern-note{font-size:12px;color:var(--text-soft);background:var(--violet-soft);border:1px solid rgba(167,139,250,0.25);border-radius:var(--radius-md);padding:12px 13px;margin-top:6px;line-height:1.55;}
.pattern-note svg{color:var(--violet);margin-right:6px;}

.review-list{display:flex;flex-direction:column;gap:8px;}
.review-item{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:9px 11px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);}
.review-item svg{flex-shrink:0;}
.review-item.ok svg{color:var(--green);}
.review-item.warn svg{color:var(--orange);}
.review-item.checking svg{color:var(--text-muted);animation:spin 1.2s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.review-item .r{margin-left:auto;font-size:10.5px;color:var(--text-dim);}

.action-row{display:flex;gap:10px;margin-top:var(--s5);flex-wrap:wrap;}

/* ---------- Pendencias ---------- */
.pending-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:var(--s5);flex-wrap:wrap;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:8px 13px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-soft);cursor:pointer;transition:.15s;}
.chip.active{background:var(--gold-soft);color:var(--gold);border-color:rgba(240,189,62,0.35);}

.pending-row{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;animation:fadeIn .3s ease;}
.pending-row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.pending-row .sku{font-family:var(--mono);color:var(--gold);font-size:11px;font-weight:700;}
.pending-row .name{font-size:14px;font-weight:700;margin-top:4px;}
.pending-row .cat{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
.pending-reason{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--orange);background:var(--orange-soft);padding:9px 12px;border-radius:9px;margin-top:11px;}
.pending-meta{font-size:11px;color:var(--text-dim);margin-top:8px;}
.resolve-form{margin-top:13px;padding-top:13px;border-top:1px dashed var(--border-strong);display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;}
.resolve-form .fld{display:flex;flex-direction:column;gap:6px;}
.resolve-form label{font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.4px;}
.resolve-form select,.resolve-form input[type=text],.resolve-form input[type=number]{
  padding:9px 12px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface-3);color:var(--text);font-family:var(--font);font-size:12.5px;outline:none;min-width:170px;
}
.pending-empty{text-align:center;padding:60px 20px;color:var(--text-muted);}
.pending-empty svg{font-size:32px;color:var(--green);margin-bottom:12px;display:block;}

.spinner-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);margin-top:10px;}
.spinner-line svg{animation:spin 1s linear infinite;color:var(--gold);}

/* ---------- Toasts ---------- */
.toast-container{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:200;max-width:340px;}
.toast{
  background:var(--surface-3);border:1px solid var(--border-strong);border-radius:11px;
  padding:13px 16px;display:flex;align-items:flex-start;gap:11px;min-width:270px;
  box-shadow:0 12px 30px rgba(0,0,0,0.5);animation:toastIn .3s ease;font-size:12.5px;line-height:1.4;
}
.toast svg{color:var(--gold);font-size:15px;margin-top:1px;flex-shrink:0;}
.toast b{font-weight:700;}

            <div class="card-title"></div>
          </div>
          <div class="activity-list" id="activityList"></div>
        </div>
      </div>

    </section>

    <!-- ===================== IMPORTAR ===================== -->
    <section class="view" id="view-importar">

          <div class="card-head"><div class="card-title"></div></div>
          <div id="importZone">

          </div>
          <div id="progressWrap" style="display:none;">

            <div class="spinner-line" id="progressLabel"></div>
          </div>
          <div id="successWrap" style="display:none;"></div>
        </div>

        <div class="card">
          <div class="card-head"><div class="card-title"></div></div>

            <tbody id="mapBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card section-gap" style="margin-top:var(--s5);">
        <div class="card-head"><div class="card-title"></div></div>
        <div style="overflow-x:auto;">
        <table class="map-table" id="previewTable"></table>
        </div>
      </div>
    </section>

    <!-- ===================== PIPELINE ===================== -->
    <section class="view" id="view-pipeline">
      <div class="pipeline-toolbar">
        <button class="btn primary" id="runPipelineBtn"></button>
        <button class="btn" id="bulkModeBtn"></button>
        <button class="btn" id="bulkApplyBtn" style="display:none;"></button>
        <div class="spacer"></div>
        <div style="font-size:12px;color:var(--text-muted);">Clique num card para abrir detalhes</div>
      </div>
      <div class="kanban-board" id="kanbanBoard"></div>
    </section>

    <!-- ===================== ANUNCIO ===================== -->
    <section class="view" id="view-anuncio">
      <div class="anuncio-toolbar">
        <select id="skuSelect"></select>
        <span id="anuncioStatusBadge"></span>
      </div>
      <div id="anuncioBody"></div>
    </section>

    <!-- ===================== PENDENCIAS ===================== -->
    <section class="view" id="view-pendencias">
      <div class="pending-toolbar">
        <div class="chip-row" id="pendingFilters"></div>
        <div class="spacer" style="flex:1;"></div>
        <div style="font-size:12px;color:var(--text-muted);" id="pendingCount"></div>
      </div>
      <div id="pendingList"></div>
    </section>

  </main>

  <footer>Protótipo funcional &middot; CatalogaIA &middot; dados simulados para demonstração</footer>

/* ===================== Toast ===================== */
function toast(iconName, html){
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${icon(iconName)}<div>${html}</div>`;
  c.appendChild(el);
  setTimeout(()=>{ el.style.animation='toastOut .3s ease forwards'; setTimeout(()=>el.remove(),300); }, 4200);
}

function logActivity(icName, txt){

  const terminal = publicados.length + pendentes.length;
  const taxa = terminal>0 ? Math.round((publicados.length/terminal)*100) : 0;
  const scoreAvg = publicados.length>0 ? Math.round(publicados.reduce((s,p)=>s+(p.quality||85),0)/publicados.length) : 0;

  const kpis = [
    {lbl:'Em Processamento', val:emProcesso.length, ic:'workflow', cls:'c-blue', unit:''},

function startImport(){
  importState='loading';

    if(pct>=100){ pct=100; clearInterval(iv); finishImport(); }
    fill.style.width = pct+'%';
  }, 110);

function finishImport(){
  const already = products.some(p=>p.sku==='MOC-5581');
  if(!already){
    IMPORT_BATCH.forEach(p=> products.push({...p}));
    logActivity('upload', `Importação concluída: <b>342</b> produtos processados, 3 novos itens entraram no pipeline`);
  }
  importState='done';
  renderImportar();
  renderDashboard();

/* ===================== Render: Pipeline ===================== */
function renderPipeline(){
  document.getElementById('runPipelineBtn').innerHTML = pipelineRunning ? `${icon('refresh')} Processando...` : `${icon('sparkles')} Executar Pipeline Agora`;
  document.getElementById('runPipelineBtn').disabled = pipelineRunning;
  document.getElementById('bulkModeBtn').innerHTML = `${icon('layers')} ${bulkMode?'Sair do Modo Seleção':'Modo Seleção em Massa'}`;
  document.getElementById('bulkApplyBtn').style.display = bulkMode ? 'inline-flex' : 'none';
  document.getElementById('bulkApplyBtn').innerHTML = `${icon('check')} Atualizar Selecionados (${bulkSelection.size})`;
  document.getElementById('bulkApplyBtn').disabled = bulkSelection.size===0;

  const stages = ['importado','pesquisa','geracao','revisao','publicado','pendente'];
  document.getElementById('kanbanBoard').innerHTML = stages.map(st=>{
    const items = products.filter(p=>p.stage===st);
    return `
    <div class="kanban-col st-${st}">
      <div class="kanban-col-head">${icon(STAGE_ICON[st])} ${STAGE_LABELS[st]} <span class="kanban-count">${items.length}</span></div>
      <div class="kanban-cards">
        ${items.length? items.map(p=>`
          <div class="kcard" data-sku="${p.sku}">
            ${bulkMode && st==='publicado' ? `<input type="checkbox" class="kcard-check" data-sku="${p.sku}" ${bulkSelection.has(p.sku)?'checked':''}>` : ''}
            <div class="sku">${p.sku}</div>
            <div class="name">${p.nome}</div>
            <div class="meta">${p.marca} &middot; ${p.modelo}</div>
            ${st==='pendente' ? `<div class="reason">${icon('warn')} ${p.motivo}</div>` : ''}
            ${st==='publicado' ? `<div class="qbadge">${icon('bar')} Score ${p.quality}</div>` : ''}
          </div>`).join('') : `<div class="kanban-empty">Nenhum item nesta etapa</div>`}
      </div>
    </div>`;
  }).join('');

  document.querySelectorAll('#kanbanBoard .kcard').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.classList.contains('kcard-check')) return;
      const sku = card.dataset.sku;
      const p = products.find(x=>x.sku===sku);
      if(!p) return;
      if(p.stage==='pendente'){
        switchView('pendencias');
        toast('warn', `Abrindo <b>${sku}</b> na fila de pendências.`);
      } else if(LISTINGS[sku]){
        selectedSku = sku;
        switchView('anuncio');
      } else {
        const msgs = {importado:'Produto aguardando início da pesquisa de anúncios similares.', pesquisa:'Produto em pesquisa de anúncios similares. A geração por IA inicia automaticamente na próxima execução do pipeline.'};
        toast('search', msgs[p.stage] || 'Produto ainda em processamento.');
      }
    });
  });
  document.querySelectorAll('#kanbanBoard .kcard-check').forEach(chk=>{
    chk.addEventListener('click', e=>e.stopPropagation());
    chk.addEventListener('change', ()=>{
      const sku = chk.dataset.sku;
      if(chk.checked) bulkSelection.add(sku); else bulkSelection.delete(sku);
      renderPipeline();
    });
  });
}

function advanceStage(p){
  const seq = ['importado','pesquisa','geracao','revisao'];
  const idx = seq.indexOf(p.stage);
  if(idx===-1) return false;
  if(idx < seq.length-1){
    p.stage = seq[idx+1];
    return true;
  }
  // leaving 'revisao' -> branch to publicado or pendente
  if(p.motivo){
    p.stage = 'pendente';
    logActivity('warn', `SKU <b>${p.sku}</b> movido para pendências &middot; ${p.motivo}`);
  } else {
    p.stage = 'publicado';
    p.quality = 82 + Math.floor(Math.random()*13);
    logActivity('check', `SKU <b>${p.sku}</b> publicado no Mercado Livre &middot; score de qualidade ${p.quality}`);
  }
  return true;
}

function runPipelineCycle(){
  if(pipelineRunning) return;
  const active = products.filter(p=>!['publicado','pendente'].includes(p.stage));
  if(active.length===0){
    toast('check', 'Todos os produtos já foram processados. Importe novos produtos para continuar.');
    return;
  }
  pipelineRunning = true;
  renderPipeline();
  let i = 0;
  const iv = setInterval(()=>{
    if(i>=active.length){
      clearInterval(iv);
      pipelineRunning = false;
      renderPipeline();
      renderDashboard();
      toast('sparkles', 'Ciclo do pipeline concluído.');
      return;
    }
    const p = active[i];
    advanceStage(p);
    renderPipeline();
    renderDashboard();
    i++;
  }, 900);
}

/* ===================== Render: Anuncio ===================== */

    const p = products.find(x=>x.sku===sku);
    return `<option value="${sku}" ${sku===selectedSku?'selected':''}>${sku} &middot; ${p.nome}</option>`;
  }).join('');
}

/* ===================== Render: Pendencias ===================== */
function renderPendencias(){
  document.getElementById('pendingFilters').innerHTML = PENDING_REASON_GROUPS.map(g=>`
    <div class="chip ${pendingFilter===g.key?'active':''}" data-key="${g.key}">${g.label}</div>`).join('');
  document.querySelectorAll('#pendingFilters .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ pendingFilter = chip.dataset.key; renderPendencias(); });
  });

  const all = products.filter(p=>p.stage==='pendente');
  const group = PENDING_REASON_GROUPS.find(g=>g.key===pendingFilter);
  const list = (pendingFilter==='todos') ? all : all.filter(p=>group.match(p.motivo));

  document.getElementById('pendingCount').textContent = `${list.length} de ${all.length} pendências exibidas`;

  if(list.length===0){
    document.getElementById('pendingList').innerHTML = `
      <div class="pending-empty">${icon('check')}Nenhuma pendência nesta categoria.<br>A fila de pendências ficará vazia quando todas as revisões forem resolvidas.</div>`;
    return;
  }

  document.getElementById('pendingList').innerHTML = list.map(p=>`
    <div class="pending-row" data-sku="${p.sku}">
      <div class="pending-row-top">
        <div>
          <div class="sku">${p.sku}</div>
          <div class="name">${p.nome}</div>
          <div class="cat">${p.categoria} &middot; ${p.marca} ${p.modelo}</div>
        </div>
        <button class="btn sm" data-act="toggle">${icon('warn')} Resolver</button>
      </div>
      <div class="pending-reason">${icon('warn')} ${p.motivo}</div>
      <div class="pending-meta">Detectado pela IA de revisão &middot; aguardando ação manual</div>
      <div class="resolve-wrap" style="display:none;"></div>
    </div>`).join('');

  document.querySelectorAll('#pendingList .pending-row').forEach(row=>{
    const sku = row.dataset.sku;
    const p = products.find(x=>x.sku===sku);
    row.querySelector('[data-act="toggle"]').addEventListener('click', ()=> openResolveForm(row, p));
  });
}

function openResolveForm(row, p){
  const wrap = row.querySelector('.resolve-wrap');
  if(wrap.style.display==='block'){ wrap.style.display='none'; wrap.innerHTML=''; return; }
  const m = p.motivo.toLowerCase();
  let fieldHtml = '';
  if(m.includes('voltagem')){
    fieldHtml = `<div class="fld"><label>Voltagem</label><select id="fixVal"><option>110V</option><option>220V</option><option selected>Bivolt</option></select></div>`;
  } else if(m.includes('peso')){
    fieldHtml = `<div class="fld"><label>Peso Correto (kg)</label><input type="number" id="fixVal" value="2.4" step="0.1"></div>`;
  } else if(m.includes('ean')){
    fieldHtml = `<div class="fld"><label>EAN Correto</label><input type="text" id="fixVal" value="7899900011223"></div>`;
  } else {
    fieldHtml = `<div class="fld"><label>Categoria Sugerida</label><select id="fixVal"><option>Informática &gt; Monitores</option><option>Eletrônicos &gt; TVs e Monitores</option></select></div>`;
  }
  wrap.style.display='block';
  wrap.innerHTML = `
    <div class="resolve-form">
      ${fieldHtml}
      <button class="btn primary sm" id="confirmFixBtn">${icon('check')} Confirmar e Reenviar para IA</button>
      <button class="btn ghost sm" id="cancelFixBtn">Cancelar</button>
    </div>`;
  wrap.querySelector('#cancelFixBtn').addEventListener('click', ()=>{ wrap.style.display='none'; wrap.innerHTML=''; });
  wrap.querySelector('#confirmFixBtn').addEventListener('click', ()=> resolvePending(row, p));
}

function resolvePending(row, p){
  const wrap = row.querySelector('.resolve-wrap');
  wrap.innerHTML = `<div class="spinner-line">${icon('refresh')} Reprocessando com IA...</div>`;
  setTimeout(()=>{
    p.stage = 'publicado';
    p.quality = 80 + Math.floor(Math.random()*14);
    delete p.motivo;
    logActivity('check', `SKU <b>${p.sku}</b> corrigido manualmente e publicado &middot; score de qualidade ${p.quality}`);
    toast('check', `<b>${p.sku}</b> publicado no Mercado Livre após correção manual.`);
    renderPendencias();
    renderPipeline();
    renderDashboard();
  }, 950);
}

/* ===================== Nav / view switching ===================== */
function switchView(name){
  document.querySelectorAll('.nav button').forEach(b=> b.classList.toggle('active', b.dataset.view===name));
  document.querySelectorAll('.view').forEach(v=> v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  if(name==='anuncio') renderAnuncio();
  if(name==='pendencias') renderPendencias();
  if(name==='pipeline') renderPipeline();
  if(name==='dashboard') renderDashboard();
}
document.querySelectorAll('.nav button').forEach(btn=>{
  btn.addEventListener('click', ()=> switchView(btn.dataset.view));
});

/* ===================== Wire up static controls ===================== */
document.getElementById('runPipelineBtn').addEventListener('click', runPipelineCycle);
document.getElementById('bulkModeBtn').addEventListener('click', ()=>{
  bulkMode = !bulkMode;
  if(!bulkMode) bulkSelection.clear();
  renderPipeline();
});
document.getElementById('bulkApplyBtn').addEventListener('click', ()=>{
  const n = bulkSelection.size;
  if(n===0) return;
  toast('link', `<b>${n}</b> produto(s) atualizados em massa &middot; preço e estoque sincronizados com o ERP via Hub Ideris.`);
  bulkSelection.clear();
  bulkMode = false;
  renderPipeline();
});
document.getElementById('skuSelect').addEventListener('change', (e)=>{
  selectedSku = e.target.value;
  renderAnuncio();
});
document.getElementById('restartBtn').addEventListener('click', ()=>{
  resetState();
  renderAll();
  switchView('dashboard');
  toast('refresh', 'Demonstração reiniciada.');
});

/* ===================== Init ===================== */
function renderAll(){
  renderDashboard();
  renderImportar();
  renderPipeline();
  renderAnuncio();
  renderPendencias();
}
function init(){
  resetState();
  renderAll();
  // dropzone click wiring happens after renderImportar builds the element
  document.getElementById('importZone').addEventListener('click', (e)=>{
    if(e.target.closest('#dropzone')) startImportSelect();
  });
}
window.addEventListener('load', init);
</script>
</body>
