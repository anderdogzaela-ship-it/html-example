<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enlaza - Prototipo app profesional</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%235b2fd6%27/%3E%3Cg fill=%27none%27 stroke=%27%23fff%27 stroke-width=%272.6%27 stroke-linecap=%27round%27%3E%3Cpath d=%27M14.5 10.5h-4a5.5 5.5 0 0 0 0 11h4M17.5 10.5h4a5.5 5.5 0 0 1 0 11h-4%27/%3E%3Cpath d=%27M11.5 16h9%27 stroke=%27%23c9b6ff%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3fa;--card:#fff;--ink:#14122b;--mute:#5d5a75;--line:#e4e1f0;--pri:#5b2fd6;--pri2:#ece6ff;--pri3:#d9ccff;--ok:#178a52;--okbg:#e2f6ea;--warn:#a35f00;--warnbg:#fff2dc;--bad:#c43c3c;--badbg:#fde8e8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:#e9e6f5;color:var(--ink);min-height:100vh}
button{font-family:inherit}
.bar{display:flex;gap:8px;justify-content:center;padding:16px 16px 0;flex-wrap:wrap}
.bar button{padding:10px 18px;border:1px solid var(--line);background:#fff;border-radius:99px;font-weight:700;cursor:pointer;color:var(--ink)}
.bar button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.hint{text-align:center;color:var(--mute);font-size:13.5px;padding:8px 16px 0;max-width:640px;margin:0 auto}
.stage{display:flex;justify-content:center;padding:16px}
/* phone */
.phone{width:390px;max-width:100%;height:800px;background:var(--bg);border-radius:38px;border:10px solid #17142e;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 24px 60px #2a1a6a33}
.head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;background:var(--bg)}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6d3cf0,#4a1fc4);color:#fff;font-weight:800;font-size:21px;display:grid;place-items:center;flex-shrink:0}
.brand{font-weight:800;font-size:21px;letter-spacing:-.02em;flex:1}
.brand small{display:block;font-size:11.5px;font-weight:500;color:var(--mute);letter-spacing:0}
.ib{border:0;background:none;cursor:pointer;color:var(--ink);padding:4px;display:grid;place-items:center;position:relative}
.ib svg{width:24px;height:24px}
.dot{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#e0344b;border:2px solid var(--bg)}
.scr{flex:1;overflow:auto;padding:4px 14px 20px}
.nav{display:flex;border-top:1px solid var(--line);background:#fff;padding:6px 4px 10px}
.nav button{flex:1;border:0;background:none;padding:6px 0;font-size:11.5px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:14px;margin:0 2px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--pri);font-weight:700;background:var(--pri2)}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{border-radius:20px;padding:24px 20px;color:#fff;font-weight:800;font-size:26px;line-height:1.15;background:radial-gradient(circle at 100% 100%,#a27bff55 0 30%,transparent 31%),linear-gradient(120deg,#5b2fd6,#8b5cf6);margin-bottom:14px}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.search svg{width:20px;height:20px;color:var(--mute);flex-shrink:0}
.search input{border:0;outline:0;font:inherit;font-size:15px;flex:1;min-width:0;background:none;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{border:0;background:var(--pri2);color:var(--ink);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.pc{display:flex;gap:14px;align-items:center}
.ph{width:96px;height:96px;border-radius:16px;object-fit:cover;background:var(--pri3);flex-shrink:0}
.pc h3{font-size:18px;font-weight:800;margin-bottom:6px}
.pill{display:inline-block;background:var(--pri2);color:#3d1a9e;font-weight:600;font-size:13px;padding:5px 11px;border-radius:99px}
.loc{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:13.5px;margin-top:7px}
.loc svg{width:16px;height:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:15.5px;cursor:pointer;margin-top:12px}
.btn svg{width:20px;height:20px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.soft{background:var(--pri2);color:var(--pri);width:auto;padding:10px 16px;margin:0}
.ver{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-size:12px;font-weight:700;margin-top:6px}
/* profile */
.cover{height:150px;margin:-4px -14px 0;background:linear-gradient(160deg,transparent 0 30%,#c8b3ff 30% 55%,transparent 55%),linear-gradient(20deg,#a98bfa 0 35%,#d8cbff 35% 70%,#b49bfb 70%);position:relative}
.cover .ib{position:absolute;top:12px;left:14px;background:#fff;border-radius:12px;width:40px;height:40px}
.pav{width:150px;height:150px;border-radius:50%;border:5px solid #fff;object-fit:cover;display:block;margin:-78px auto 0;position:relative;background:var(--pri3)}
.pname{text-align:center;font-size:26px;font-weight:800;margin-top:10px}
.prole{text-align:center;color:var(--mute);font-size:16px;margin-top:2px}
.meta{display:flex;justify-content:center;gap:12px;color:var(--mute);font-size:13.5px;margin-top:10px;align-items:center}
.meta span{display:flex;gap:5px;align-items:center}.meta svg{width:16px;height:16px}
.card h4{font-size:18px;font-weight:800;margin-bottom:8px}
.card p{color:var(--mute);font-size:14.5px;line-height:1.5}
.lock{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:13.5px;margin-top:10px;line-height:1.45}
/* chat */
.chathead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fff}
.chathead img{width:46px;height:46px;border-radius:50%;object-fit:cover}
.chathead .on{position:relative}
.chathead .on::after{content:"";position:absolute;right:0;bottom:2px;width:11px;height:11px;border-radius:50%;background:#22c55e;border:2px solid #fff}
.chathead b{font-size:16px;display:block}.chathead small{color:var(--mute);font-size:12.5px}
.day{text-align:center;margin:10px 0}.day span{background:var(--pri2);color:var(--mute);font-size:12px;padding:3px 12px;border-radius:99px}
.row{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
.row.out{justify-content:flex-end}
.row img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.bub{max-width:76%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.4;background:#fff;border:1px solid var(--line)}
.out .bub{background:var(--pri);color:#fff;border:0}
.bub time{display:block;font-size:11px;opacity:.7;margin-top:4px;text-align:right}
.file{display:flex;align-items:center;gap:10px;background:var(--pri2);border-radius:12px;padding:10px;min-width:210px}
.file svg{width:26px;height:26px;color:var(--pri)}
.file b{font-size:13.5px;display:block}.file small{font-size:12px;color:var(--mute)}
.composer{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--bg)}
.composer .plus{width:42px;height:42px;border-radius:50%;background:var(--pri2);border:0;color:var(--pri);display:grid;place-items:center;cursor:pointer}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:99px;padding:11px 16px;font:inherit;font-size:14px;outline:0}
.composer .send{width:46px;height:42px;border-radius:14px;background:var(--pri);border:0;color:#fff;display:grid;place-items:center;cursor:pointer}
.composer svg{width:20px;height:20px}
/* plans */
.h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
.sub{color:var(--mute);font-size:14.5px;line-height:1.45;margin-bottom:14px}
.plan{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.plan.pro{background:#f4efff;border-color:#b9a2f5}
.plan .top{display:flex;justify-content:space-between;gap:10px}
.plan h3{font-size:24px;font-weight:800}
.price{font-size:28px;font-weight:800;white-space:nowrap}.price small{font-size:14px;font-weight:500;color:var(--mute)}
.plan .d{color:var(--mute);font-size:13.5px;margin-top:2px}
.plan hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.plan ul{list-style:none}.plan li{display:flex;gap:10px;font-size:14px;margin:8px 0;align-items:flex-start}
.plan li svg{width:18px;height:18px;color:var(--mute);flex-shrink:0;margin-top:1px}
.feat{display:flex;gap:12px;margin:10px 0}.feat i{width:44px;height:44px;border-radius:12px;background:var(--pri2);display:grid;place-items:center;color:var(--pri);flex-shrink:0}.feat i svg{width:22px;height:22px}
.feat b{font-size:15px;display:block}.feat small{color:var(--mute);font-size:13px}
.back{display:flex;align-items:center;gap:8px;border:0;background:none;font:inherit;font-size:16px;cursor:pointer;margin:6px 0;color:var(--ink)}.back svg{width:22px;height:22px}
.sum{display:flex;gap:12px;align-items:center}.sum i{width:60px;height:60px;border-radius:14px;background:var(--pri2);display:grid;place-items:center}
.sum i .logo{width:34px;height:34px;font-size:19px}
.total{display:flex;justify-content:space-between;align-items:flex-start;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--pri2);color:var(--pri);font-weight:600;font-size:13px;padding:7px 12px;border-radius:10px;margin-top:14px}
.tag svg{width:18px;height:18px}
.pay{display:flex;gap:8px;margin-top:10px}
.pay label{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-size:12.5px;cursor:pointer;line-height:1.3}
.pay label.on{border-color:var(--pri);background:var(--pri2)}
.pay input{margin-right:5px}
.note{font-size:12.5px;color:var(--mute);margin-top:8px;line-height:1.45}
/* library */
.res{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;position:relative}
.thumb{width:96px;height:118px;border-radius:8px;background:#f1edff;border:1px solid var(--pri3);padding:9px;font-size:11.5px;font-weight:800;line-height:1.2;flex-shrink:0;position:relative;overflow:hidden}
.thumb::after{content:"";position:absolute;top:0;right:0;border-width:0 16px 16px 0;border-style:solid;border-color:var(--pri3) var(--bg)}
.thumb .img{height:34px;margin-top:8px;border-radius:4px;background:linear-gradient(160deg,transparent 45%,#a78bfa 45% 70%,#c4b5fd 70%) #ddd6fe}
.thumb .ln{height:4px;background:#c4b5fd;border-radius:2px;margin-top:6px}
.res h3{font-size:16.5px;font-weight:800;line-height:1.2;padding-right:26px}
.res p{color:var(--mute);font-size:13px;line-height:1.4;margin:5px 0 8px}
.ft{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mute)}
.ft b{background:var(--pri2);color:var(--pri);padding:5px 10px;border-radius:8px;font-size:12px}
.bm{position:absolute;top:12px;right:12px}
.res .open{border:0;background:var(--pri);color:#fff;border-radius:8px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer;margin-left:auto}
.res .open.lk{background:var(--warnbg);color:var(--warn)}
/* account */
label.f{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
.in{width:100%;font:inherit;font-size:15px;padding:12px 14px;border:1px solid #cfcadf;border-radius:10px;background:#fff;color:var(--ink)}
.mem{display:flex;align-items:center;gap:12px}.mem i{width:54px;height:54px;border-radius:14px;background:var(--pri2);display:grid;place-items:center;color:var(--pri);flex-shrink:0}.mem i svg{width:28px;height:28px}
.mem div{flex:1}.mem b{font-size:17px}.mem small{display:block;color:var(--mute);font-size:13px}
.toast{position:absolute;left:16px;right:16px;bottom:86px;background:#1c1740;color:#fff;padding:12px 14px;border-radius:12px;font-size:13.5px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:5}
.toast.on{opacity:1;transform:none}
/* admin */
.admin{display:none;width:1180px;max-width:100%;background:var(--bg);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px #2a1a6a22;min-height:640px;position:relative}
.admin.show{display:flex}
.aside{width:240px;background:#fff;border-right:1px solid var(--line);padding:22px 14px;flex-shrink:0}
.aside .bw{display:flex;align-items:center;gap:10px;margin:0 6px 26px}
.aside button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 14px;border-radius:12px;font-size:15.5px;cursor:pointer;color:var(--ink);margin-bottom:4px}
.aside button svg{width:22px;height:22px}
.aside button.on{background:var(--pri2);color:var(--pri);font-weight:700}
.amain{flex:1;min-width:0;padding:20px 28px 30px}
.atop{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.atop .search{flex:1;margin:0;max-width:620px}
.atop .av{width:40px;height:40px;border-radius:50%;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-weight:800;margin-left:auto}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:16px 0 26px}
.k{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;gap:14px;align-items:center}
.k i{width:56px;height:56px;border-radius:14px;background:var(--pri2);color:var(--pri);display:grid;place-items:center}.k i svg{width:28px;height:28px}
.k small{font-size:14px;color:var(--mute)}.k b{display:block;font-size:30px;font-weight:800}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sh h2{font-size:26px;font-weight:800}.sh p{color:var(--mute);font-size:14.5px}
.tb{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;overflow-x:auto}
.tf{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}.tf .search{flex:1;min-width:220px;margin:0}
.tf select{font:inherit;font-size:14px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:200px}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:640px}
th{background:var(--pri2);text-align:left;padding:13px 16px;font-weight:700}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
td{padding:13px 16px;border-bottom:1px solid var(--line)}
.u{display:flex;gap:12px;align-items:center}.u img{width:50px;height:50px;border-radius:50%;object-fit:cover}.u b{display:block}.u small{color:var(--mute)}
.st{display:inline-block;font-size:13px;font-weight:700;padding:5px 13px;border-radius:99px}
.st.ok{background:var(--okbg);color:var(--ok)}.st.w{background:var(--warnbg);color:var(--warn)}.st.b{background:var(--badbg);color:var(--bad)}
.act{display:flex;gap:8px}.act button{width:40px;height:36px;border-radius:10px;border:0;background:var(--pri2);color:var(--pri);cursor:pointer;display:grid;place-items:center;font-weight:700;font-size:12px}
.act button.txt{width:auto;padding:0 12px}
.act svg{width:18px;height:18px}
.alert{background:var(--badbg);color:var(--bad);border-radius:14px;padding:14px 16px;margin-bottom:12px;font-size:14.5px}
.alert.i{background:var(--pri2);color:var(--pri)}
.form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:16px}
@media(max-width:860px){.admin{flex-direction:column}.aside{width:100%;display:flex;gap:4px;overflow-x:auto;padding:12px}.aside .bw{display:none}.aside button{width:auto;white-space:nowrap}.amain{padding:16px}.kp{grid-template-columns:1fr}.form{grid-template-columns:1fr}.atop .search{display:none}}
@media(max-width:440px){.stage{padding:8px 0 0}.phone{border:0;border-radius:0;height:calc(100vh - 110px);width:100%}}
</style>
</head>

  <div class="pay"><label class="${S.pay==='store'?'on':''}"><input type="radio" name="pm" value="store" ${S.pay==='store'?'checked':''}>Tienda del celular<br><small>Apple / Google</small></label><label class="${S.pay==='paypal'?'on':''}"><input type="radio" name="pm" value="paypal" ${S.pay==='paypal'?'checked':''}>PayPal<br><small>en la web</small></label></div>
  <p class="note">${S.pay==='store'?'Se cobra con la cuenta de Apple o Google del usuario; la tienda retiene una comisión.':'La membresía se activa cuando PayPal confirma el cobro, aunque el usuario pierda la señal antes de volver a la app.'}</p>
  <span class="tag">${ic('card')}Pago simulado</span>
  <button class="btn" id="buy">Simular pago</button>
  <div class="card" style="margin-top:16px;padding:18px"><h4>Todo lo que obtienes con Pro</h4>
  ${[['users','Más visibilidad para tu perfil'],['chart','Estadísticas de tu presencia profesional'],['layers','Acceso a recursos y contenidos exclusivos'],['brief','Herramientas para impulsar tu carrera']].map(([i,t])=>`<div class="feat" style="align-items:center"><i style="width:38px;height:38px">${ic(i)}</i><span style="font-size:14.5px">${t}</span></div>`).join('')}</div>`;
  $('bk').onclick=()=>{S.checkout=false;V.planes()};
  document.querySelectorAll('input[name=pm]').forEach(r=>r.onchange=()=>{S.pay=r.value;V.checkout()});
  $('buy').onclick=()=>{const b=$('buy');b.disabled=true;b.textContent=S.pay==='paypal'?'Esperando confirmación de PayPal...':'Procesando pago...';
   setTimeout(()=>{S.plan=1;S.checkout=false;S.payments.unshift({u:S.me.n,pl:'Pro',m:12,via:S.pay==='paypal'?'PayPal (web)':'App Store',st:'Pagado',f:'Hoy'});toast('Membresía Pro activa: mensajes y biblioteca desbloqueados');go('cuenta')},1400)}},
 cuenta(){$('headSlot').innerHTML=hd(bell+`<button class="ib">${ic('gear')}</button>`,'Red profesional de Latinoamérica');const m=S.me;
  $('scr').innerHTML=`<div class="h1">Mi cuenta</div><div class="sub">Gestiona tu perfil, tu membresía y tus preferencias.</div>
  <div class="card" style="padding:18px"><div class="pc">${img(P+'women/65.jpg','',m.n).replace('class=""','style="width:90px;height:90px;border-radius:50%;object-fit:cover;background:var(--pri3)"')}<div><h4 style="margin:0">Editar perfil</h4><p style="font-size:14px">Actualiza tu información profesional.</p></div></div>
  <label class="f">Nombre completo</label><input class="in" id="mn" value="${esc(m.n)}">
  <label class="f">Correo electrónico</label><input class="in" id="me" value="${esc(m.e)}">
  <label class="f">Especialidad</label><select class="in" id="ms">${['Marketing Digital','Diseño UX/UI','Desarrollo de software','Análisis de datos'].map(x=>`<option ${x===m.sp?'selected':''}>${x}</option>`).join('')}</select>
  <label class="f">Ciudad</label><select class="in" id="mc">${['Bogotá, Colombia','Ciudad de México, México','Lima, Perú','Santiago, Chile','Buenos Aires, Argentina'].map(x=>`<option ${x===m.c?'selected':''}>${x}</option>`).join('')}</select>
  <button class="btn" id="sv">Guardar perfil</button></div>
  <div class="card mem" style="padding:16px"><i>${ic('crown')}</i><div><b>Membresía ${S.plan?'Pro':'Gratuita'}</b><small>${S.plan?'Accede a todas las funciones. Renueva el 24 de cada mes.':'Mejora a Pro para enviar mensajes.'}</small></div><button class="btn soft" id="mg">${S.plan?'Gestionar':'Mejorar'}</button></div>`;
  $('sv').onclick=()=>{m.n=$('mn').value;m.e=$('me').value;m.sp=$('ms').value;m.c=$('mc').value;toast('Perfil guardado')};
  $('mg').onclick=()=>go('planes')}
};
/* admin */
const A={
 tabs:[['resumen','Resumen','chart'],['usuarios','Usuarios','users'],['pagos','Pagos','card'],['recursos','Recursos','layers']],
 render(){$('aside').innerHTML=`<div class="bw"><div class="logo"><svg viewBox="0 0 32 32" style="width:70%;height:70%;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round"><path d="M14.5 10.5h-4a5.5 5.5 0 0 0 0 11h4"/><path d="M17.5 10.5h4a5.5 5.5 0 0 1 0 11h-4"/><path d="M11.5 16h9" stroke="#c9b6ff"/></svg></div><div class="brand">Enlaza</div></div>`+A.tabs.map(([k,l,i])=>`<button class="${S.atab===k?'on':''}" data-a="${k}">${ic(i)}${l}</button>`).join('');
  $('aside').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.atab=b.dataset.a;A.render()});A[S.atab]()},
 kpis(){const paid=S.payments.filter(p=>p.st==='Pagado').length;return `<div class="kp"><div class="k"><i>${ic('users')}</i><div><small>Perfiles activos</small><b>${(2841+PROS.filter(p=>p.st==='Activo').length-5).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')}</b></div></div><div class="k"><i>${ic('card')}</i><div><small>Pagos registrados</small><b>${(1371+S.payments.length).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')}</b></div></div><div class="k"><i>${ic('layers')}</i><div><small>Recursos publicados</small><b>${424+RES.length}</b></div></div></div>`},
 resumen(){const f=S.payments.filter(p=>p.st==='Fallido'),pend=PROS.filter(p=>p.st==='Pendiente');
  $('amain').innerHTML=`<div class="h1" style="font-size:40px">Panel administrativo</div>${A.kpis()}<div class="sh"><div><h2>Requiere atención</h2><p>Lo que conviene revisar hoy.</p></div></div>
  ${f.map(p=>`<div class="alert">Pago fallido de ${p.u} (${p.pl}, ${p.via}). La membresía quedó en espera y sin acceso a los recursos Pro.</div>`).join('')}
  ${pend.length?`<div class="alert i">${pend.length} perfiles esperan verificación. <a href="#" id="gv" style="color:inherit;font-weight:700">Revisar</a></div>`:'<div class="alert i">No hay perfiles pendientes de verificación.</div>'}`;
  if($('gv'))$('gv').onclick=e=>{e.preventDefault();S.atab='usuarios';S.af.st='Pendiente';A.render()}},
 usuarios(){const f=S.af,q=f.q.toLowerCase();const list=PROS.filter(p=>(!q||p.n.toLowerCase().includes(q))&&(!f.cat||p.cat===f.cat)&&(!f.st||p.st===f.st));
  $('amain').innerHTML=`<div class="h1" style="font-size:40px">Panel administrativo</div>${A.kpis()}
  <div class="sh"><div><h2>Usuarios</h2><p>Gestiona los profesionales registrados en Enlaza.</p></div><button class="btn" style="width:auto;margin:0;padding:12px 20px" onclick="toast('Formulario para agregar un usuario manualmente','toast2')">${ic('userplus')}Agregar usuario</button></div>
  <div class="tb"><div class="tf"><div class="search">${ic('search')}<input id="aq" placeholder="Buscar usuario por nombre..." value="${esc(f.q)}"></div>
  <select id="ac"><option value="">Todas las especialidades</option>${['Diseño','Tecnología','Marketing'].map(x=>`<option ${f.cat===x?'selected':''}>${x}</option>`).join('')}</select>
  <select id="as"><option value="">Todos los estados</option>${['Activo','Pendiente','Suspendido'].map(x=>`<option ${f.st===x?'selected':''}>${x}</option>`).join('')}</select></div>
  <table><tr><th>Profesional</th><th>Especialidad</th><th>Estado</th><th>Acción</th></tr>
  ${list.map(p=>`<tr><td><div class="u">${img(p.img,'',p.n)}<div><b>${p.n}</b><small>${p.em}</small></div></div></td><td>${p.cat}</td><td><span class="st ${p.st==='Activo'?'ok':p.st==='Pendiente'?'w':'b'}">${p.st}</span></td><td><div class="act">${p.st==='Pendiente'?`<button class="txt" data-ok="${p.id}">Aprobar</button>`:''}<button data-v="${p.id}" title="Ver">${ic('eye')}</button><button title="Editar" onclick="toast('Editar datos de ${p.n}','toast2')">${ic('pen')}</button><button data-s="${p.id}" title="${p.st==='Suspendido'?'Reactivar':'Suspender'}">${ic('dots')}</button></div></td></tr>`).join('')||'<tr><td colspan="4" style="color:var(--mute)">Sin usuarios con esos filtros.</td></tr>'}</table></div>`;
  $('aq').oninput=e=>{f.q=e.target.value;const pos=e.target.selectionStart;A.usuarios();const i=$('aq');i.focus();i.setSelectionRange(pos,pos)};
  $('ac').onchange=e=>{f.cat=e.target.value;A.usuarios()};$('as').onchange=e=>{f.st=e.target.value;A.usuarios()};
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{const p=PROS.find(x=>x.id==b.dataset.ok);p.st='Activo';p.v=true;toast(p.n+' aprobado: ya aparece verificado en la app','toast2');A.usuarios()});
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const p=PROS.find(x=>x.id==b.dataset.s);p.st=p.st==='Suspendido'?'Activo':'Suspendido';toast(p.n+': '+p.st.toLowerCase(),'toast2');A.usuarios()});
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.open=+b.dataset.v;setView('user');go('perfil')})},
 pagos(){$('amain').innerHTML=`<div class="h1" style="font-size:40px">Panel administrativo</div>${A.kpis()}<div class="sh"><div><h2>Pagos</h2><p>Cada cobro con su medio y estado. Un pago fallido o reembolsado retira el acceso Pro automáticamente.</p></div></div>
  <div class="tb"><table><tr><th>Usuario</th><th>Plan</th><th>Monto</th><th>Medio</th><th>Fecha</th><th>Estado</th></tr>${S.payments.map(p=>`<tr><td><b>${p.u}</b></td><td>${p.pl}</td><td>USD ${p.m}</td><td>${p.via}</td><td>${p.f}</td><td><span class="st ${p.st==='Pagado'?'ok':p.st==='Fallido'?'b':'w'}">${p.st}</span></td></tr>`).join('')}</table></div>`},
 recursos(){$('amain').innerHTML=`<div class="h1" style="font-size:40px">Panel administrativo</div>${A.kpis()}<div class="sh"><div><h2>Recursos</h2><p>Publica contenidos en la biblioteca y decide qué plan los incluye.</p></div></div>
  <div class="tb"><div class="form"><div><label class="f" style="margin-top:0">Título</label><input class="in" id="nt" placeholder="Ej.: Guía de entrevistas"></div><div><label class="f" style="margin-top:0">Categoría</label><select class="in" id="nc">${['Carrera','Negocios','Portafolio','Perfil'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label class="f" style="margin-top:0">Plan</label><select class="in" id="np"><option value="0">Gratuito</option><option value="1">Pro</option></select></div><button class="btn" id="add" style="margin:0">Publicar</button></div>
  <table><tr><th>Recurso</th><th>Categoría</th><th>Formato</th><th>Plan</th></tr>${RES.map(r=>`<tr><td><b>${r.t}</b></td><td>${r.cat}</td><td>${r.k}</td><td><span class="st ${r.pl?'w':'ok'}">${r.pl?'Pro':'Gratuito'}</span></td></tr>`).join('')}</table></div>`;
  $('add').onclick=()=>{const t=$('nt').value.trim();if(!t){toast('Escribe un título','toast2');return}RES.unshift({t,d:'Recurso recién publicado desde el panel.',k:'PDF',s:'Nuevo',cat:$('nc').value,pl:+$('np').value,th:'img'});toast('Publicado: ya aparece en la Biblioteca de la app','toast2');A.recursos()}}
};
function setView(v){S.view=v;$('vUser').classList.toggle('on',v==='user');$('vAdmin').classList.toggle('on',v==='admin');$('phone').style.display=v==='user'?'':'none';$('admin').classList.toggle('show',v==='admin');
 $('hint').textContent=v==='user'?'Prototipo navegable con datos de ejemplo y pagos simulados. Prueba esto: abre un perfil y toca "Enviar mensaje" con el plan gratuito, activa Pro en "Planes" y vuelve a la biblioteca.':'Panel web del administrador: aprueba perfiles pendientes, filtra usuarios, revisa pagos (incluido uno fallido) y publica recursos que aparecen al instante en la app.';
 if(v==='admin')A.render();else render()}
$('vUser').onclick=()=>setView('user');$('vAdmin').onclick=()=>setView('admin');
render();
</script>
</body>
</html>
