<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProLance - Prototipo Fase 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#4f46e5;
    --primary-dark:#4338ca;
    --primary-light:#eef2ff;
    --primary-100:#e0e7ff;
    --slate-50:#f8fafc;
    --slate-100:#f1f5f9;
    --slate-200:#e2e8f0;
    --slate-300:#cbd5e1;
    --slate-400:#94a3b8;
    --slate-500:#64748b;
    --slate-600:#475569;
    --slate-700:#334155;
    --slate-800:#1e293b;
    --slate-900:#0f172a;
    --success:#059669;
    --success-bg:#d1fae5;
    --success-text:#065f46;
    --warning:#d97706;
    --warning-bg:#fef3c7;
    --warning-text:#92400e;
    --danger:#dc2626;
    --danger-bg:#fee2e2;
    --danger-text:#991b1b;
    --info:#2563eb;
    --info-bg:#dbeafe;
    --info-text:#1e40af;
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(15,23,42,0.06);
    --shadow-md:0 4px 12px rgba(15,23,42,0.08);
    --shadow-lg:0 12px 32px rgba(15,23,42,0.14);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito', system-ui, -apple-system, sans-serif;
    background:var(--slate-100);
    color:var(--slate-800);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .icon{width:16px;height:16px;flex-shrink:0;}
  .icon-lg{width:22px;height:22px;}

  /* ---------- Browser chrome shell ---------- */
  .browser-shell{
    max-width:1240px;
    margin:24px auto;
    background:#fff;
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    overflow:hidden;
    border:1px solid var(--slate-200);
  }
  .browser-topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 16px;
    background:linear-gradient(180deg,#f8fafc,#eef0f3);
    border-bottom:1px solid var(--slate-200);
  }
  .traffic-lights{display:flex;gap:7px;}
  .traffic-lights span{width:11px;height:11px;border-radius:50%;display:inline-block;}
  .tl-red{background:#ef4444;}
  .tl-yellow{background:#f59e0b;}
  .tl-green{background:#10b981;}
  .browser-url{
    flex:1;
    background:#fff;
    border:1px solid var(--slate-200);
    border-radius:999px;
    padding:6px 16px;
    font-size:12.5px;
    color:var(--slate-500);
    display:flex;
    align-items:center;
    gap:8px;
    max-width:520px;
  }
  .browser-url .lock{font-size:11px;}
  .browser-url b{color:var(--slate-700);font-weight:700;}

  /* ---------- App header ---------- */
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:16px 28px;
    border-bottom:1px solid var(--slate-200);
    flex-wrap:wrap;
  }
  .app-logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:900;
    font-size:20px;
    color:var(--slate-900);
    letter-spacing:-0.02em;
  }
  .app-logo .mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--primary),#7c6ff0);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:900;font-size:16px;
    box-shadow:0 4px 10px rgba(79,70,229,0.35);
  }
  .app-logo .tag{
    font-size:11px;font-weight:700;color:var(--primary);
    background:var(--primary-light);
    padding:2px 8px;border-radius:999px;
    text-transform:uppercase;letter-spacing:0.04em;
  }
  .role-switcher{
    display:flex;
    gap:4px;
    background:var(--slate-100);
    padding:4px;
    border-radius:999px;
    border:1px solid var(--slate-200);
  }
  .role-pill{
    border:none;background:transparent;
    padding:9px 20px;
    font-family:inherit;font-weight:700;font-size:14px;
    color:var(--slate-500);
    border-radius:999px;
    cursor:pointer;
    transition:all 0.2s ease;
    display:flex;align-items:center;gap:7px;
    white-space:nowrap;
  }
  .role-pill:hover{color:var(--slate-800);}
  .role-pill.active{
    background:var(--primary);
    color:#fff;
    box-shadow:0 3px 10px rgba(79,70,229,0.35);
  }

  .app-body{
    padding:26px 28px 60px;
    min-height:560px;
    background:var(--slate-50);
  }
  .view{display:none;animation:fadein 0.25s ease;}
  .view.active{display:block;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .view-header{
    display:flex;align-items:center;justify-content:space-between;
    gap:14px;margin-bottom:20px;flex-wrap:wrap;
  }
  .view-title{font-size:22px;font-weight:800;color:var(--slate-900);letter-spacing:-0.01em;}
  .view-subtitle{font-size:13.5px;color:var(--slate-500);margin-top:3px;font-weight:600;}

  .btn{
    font-family:inherit;
    border:none;cursor:pointer;
    font-weight:700;font-size:14px;
    border-radius:var(--radius-sm);
    padding:10px 18px;
    display:inline-flex;align-items:center;gap:8px;
    transition:all 0.15s ease;
    white-space:nowrap;
  }
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,0.3);}
  .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(79,70,229,0.4);}
  .btn-secondary{background:#fff;color:var(--slate-700);border:1px solid var(--slate-300);}
  .btn-secondary:hover{background:var(--slate-100);border-color:var(--slate-400);}
  .btn-success{background:var(--success);color:#fff;}
  .btn-success:hover{background:#047857;transform:translateY(-1px);}
  .btn-danger{background:#fff;color:var(--danger);border:1px solid var(--danger-bg);}
  .btn-danger:hover{background:var(--danger-bg);}
  .btn-sm{padding:7px 13px;font-size:12.5px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none !important;}

  /* ---------- Cards / grid ---------- */
  .grid-cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:18px;
  }
  .card{
    background:#fff;
    border:1px solid var(--slate-200);
    border-radius:var(--radius-md);
    padding:20px;
    box-shadow:var(--shadow-sm);
    transition:box-shadow 0.2s ease, transform 0.2s ease;
    cursor:pointer;
    display:flex;flex-direction:column;gap:10px;
  }
  .card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .card-title{font-size:15.5px;font-weight:800;color:var(--slate-900);line-height:1.35;}
  .card-desc{font-size:13px;color:var(--slate-500);line-height:1.5;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--slate-500);font-weight:700;}
  .meta-chip{background:var(--slate-100);padding:4px 10px;border-radius:999px;display:flex;align-items:center;gap:5px;}
  .card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:4px;padding-top:12px;border-top:1px solid var(--slate-100);}

  .badge{
    font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px;
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
    transition:background-color 0.35s ease, color 0.35s ease;
  }
  .badge-dot{width:6px;height:6px;border-radius:50%;}
  .badge-aberto{background:var(--info-bg);color:var(--info-text);}
  .badge-aberto .badge-dot{background:var(--info);}
  .badge-proposta-aceita{background:var(--warning-bg);color:var(--warning-text);}
  .badge-proposta-aceita .badge-dot{background:var(--warning);}
  .badge-em-andamento{background:var(--primary-light);color:var(--primary-dark);}
  .badge-em-andamento .badge-dot{background:var(--primary);}
  .badge-concluido{background:var(--success-bg);color:var(--success-text);}
  .badge-concluido .badge-dot{background:var(--success);}
  .badge-enviada{background:var(--slate-200);color:var(--slate-600);}
  .badge-recusada{background:var(--danger-bg);color:var(--danger-text);}
  .badge-suspenso{background:var(--danger-bg);color:var(--danger-text);}
  .badge-ativo{background:var(--success-bg);color:var(--success-text);}

  .category-tag{
    font-size:11.5px;font-weight:800;color:var(--primary-dark);
    background:var(--primary-light);
    padding:4px 10px;border-radius:6px;
  }

  .avatar{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:14px;flex-shrink:0;
    box-shadow:0 2px 6px rgba(15,23,42,0.15);
  }
  .avatar-lg{width:48px;height:48px;font-size:17px;}
  .avatar-sm{width:30px;height:30px;font-size:12px;}

  /* ---------- Empty state ---------- */
  .empty-state{
    text-align:center;padding:60px 20px;color:var(--slate-400);
    background:#fff;border:1px dashed var(--slate-300);border-radius:var(--radius-md);
  }
  .empty-state .icon-lg{margin:0 auto 12px;width:38px;height:38px;color:var(--slate-300);}
  .empty-state p{font-weight:700;margin:0;}

  /* ---------- Back button ---------- */
  .back-link{
    display:inline-flex;align-items:center;gap:7px;
    color:var(--slate-500);font-weight:700;font-size:13.5px;
    background:none;border:none;cursor:pointer;padding:6px 0;margin-bottom:14px;
    transition:color 0.15s ease;
  }
  .back-link:hover{color:var(--primary);}

  /* ---------- Detail view ---------- */
  .detail-header{
    background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius-md);
    padding:22px;margin-bottom:20px;box-shadow:var(--shadow-sm);
  }
  .detail-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .detail-title{font-size:19px;font-weight:800;color:var(--slate-900);margin-bottom:6px;}
  .detail-desc{color:var(--slate-600);font-size:14px;line-height:1.6;font-weight:600;margin:12px 0 0;}
  .detail-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}

  .section-block{
    background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius-md);
    padding:20px;margin-bottom:18px;box-shadow:var(--shadow-sm);
  }
  .section-block h3{margin:0 0 14px;font-size:15px;font-weight:800;color:var(--slate-900);display:flex;align-items:center;gap:8px;}

  .proposta-card{
    display:flex;gap:14px;padding:16px;border:1px solid var(--slate-200);border-radius:var(--radius-md);
    margin-bottom:12px;transition:filter 0.4s ease, opacity 0.4s ease, background-color 0.3s ease;
    background:#fff;
  }
  .proposta-card:last-child{margin-bottom:0;}
  .proposta-card.locked{filter:grayscale(1);opacity:0.55;}
  .proposta-card.aceita{background:var(--success-bg);border-color:#a7f3d0;}
  .proposta-body{flex:1;min-width:0;}
  .proposta-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .proposta-nome{font-weight:800;font-size:14px;color:var(--slate-900);}
  .proposta-prazo{font-size:12.5px;color:var(--slate-500);font-weight:700;display:flex;align-items:center;gap:5px;margin-bottom:6px;}
  .proposta-msg{font-size:13.5px;color:var(--slate-600);line-height:1.5;font-weight:600;}
  .proposta-actions{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .closed-label{font-size:12px;color:var(--slate-400);font-weight:700;font-style:italic;}

  /* ---------- Chat ---------- */
  .chat-panel{display:flex;flex-direction:column;height:340px;}
  .chat-messages{flex:1;overflow-y:auto;padding:6px 4px 10px;display:flex;flex-direction:column;gap:10px;}
  .chat-bubble-row{display:flex;gap:8px;max-width:78%;}
  .chat-bubble-row.mine{align-self:flex-end;flex-direction:row-reverse;}
  .chat-bubble{
    padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.45;font-weight:600;
    background:var(--slate-100);color:var(--slate-800);
  }
  .chat-bubble-row.mine .chat-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
  .chat-bubble-row:not(.mine) .chat-bubble{border-bottom-left-radius:4px;}
  .chat-time{font-size:10.5px;color:var(--slate-400);margin-top:4px;font-weight:700;}
  .chat-bubble-row.mine .chat-time{text-align:right;}
  .chat-input-row{display:flex;gap:10px;padding-top:12px;border-top:1px solid var(--slate-100);}
  .chat-input-row input{flex:1;}

  /* ---------- Forms ---------- */
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:800;color:var(--slate-700);margin-bottom:6px;}
  .field input[type=text],.field input[type=number],.field textarea,.field select{
    width:100%;font-family:inherit;font-size:14px;font-weight:600;color:var(--slate-800);
    border:1.5px solid var(--slate-200);border-radius:var(--radius-sm);
    padding:10px 13px;background:var(--slate-50);
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .field input:focus,.field textarea:focus,.field select:focus{
    outline:none;border-color:var(--primary);background:#fff;
  }
  .field textarea{resize:vertical;min-height:80px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,23,42,0.5);
    display:flex;align-items:center;justify-content:center;
    z-index:200;opacity:0;pointer-events:none;transition:opacity 0.2s ease;padding:20px;
  }
  .modal-overlay.show{opacity:1;pointer-events:auto;}
  .modal-box{
    background:#fff;border-radius:var(--radius-lg);padding:26px;width:100%;max-width:460px;
    box-shadow:var(--shadow-lg);transform:translateY(14px) scale(0.98);opacity:0;
    transition:transform 0.25s ease, opacity 0.25s ease;max-height:88vh;overflow-y:auto;
  }
  .modal-overlay.show .modal-box{transform:translateY(0) scale(1);opacity:1;}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .modal-header h3{margin:0;font-size:17px;font-weight:800;color:var(--slate-900);}
  .modal-close{background:var(--slate-100);border:none;border-radius:8px;width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--slate-500);}
  .modal-close:hover{background:var(--slate-200);color:var(--slate-800);}
  .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}

  /* ---------- Tabs (sub-nav) ---------- */
  .subtabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--slate-200);flex-wrap:wrap;}
  .subtab{
    background:none;border:none;font-family:inherit;font-weight:700;font-size:13.5px;
    color:var(--slate-500);padding:10px 16px;cursor:pointer;border-bottom:2.5px solid transparent;
    margin-bottom:-1px;transition:color 0.15s ease,border-color 0.15s ease;
    display:flex;align-items:center;gap:7px;
  }
  .subtab:hover{color:var(--slate-800);}
  .subtab.active{color:var(--primary);border-color:var(--primary);}

  /* ---------- Filter chips ---------- */
  .filter-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .chip{
    font-family:inherit;font-weight:700;font-size:12.5px;color:var(--slate-600);
    background:#fff;border:1.5px solid var(--slate-200);border-radius:999px;
    padding:7px 15px;cursor:pointer;transition:all 0.15s ease;
  }
  .chip:hover{border-color:var(--primary);color:var(--primary);}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  /* ---------- Tables ---------- */
  .table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);}
  table{width:100%;border-collapse:collapse;min-width:560px;}
  thead th{
    text-align:left;font-size:11.5px;font-weight:800;color:var(--slate-500);text-transform:uppercase;
    letter-spacing:0.04em;padding:13px 18px;border-bottom:1px solid var(--slate-200);background:var(--slate-50);
  }
  tbody td{padding:14px 18px;font-size:13.5px;font-weight:600;color:var(--slate-700);border-bottom:1px solid var(--slate-100);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--slate-50);}
  .cell-user{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--slate-900);}

  /* ---------- Admin categories ---------- */
  .categoria-list{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
  .categoria-pill{
    display:flex;align-items:center;gap:9px;background:var(--primary-light);color:var(--primary-dark);
    padding:8px 8px 8px 15px;border-radius:999px;font-weight:800;font-size:13.5px;
  }
  .categoria-pill button{
    background:rgba(255,255,255,0.6);border:none;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--primary-dark);
    transition:background 0.15s ease;
  }
  .categoria-pill button:hover{background:#fff;color:var(--danger);}
  .add-categoria-row{display:flex;gap:10px;}
  .add-categoria-row input{flex:1;}

  /* ---------- Stars ---------- */
  .star-input{display:flex;gap:6px;font-size:30px;cursor:pointer;margin-bottom:6px;}
  .star-input span{color:var(--slate-300);transition:color 0.15s ease,transform 0.1s ease;}
  .star-input span.filled{color:#f59e0b;}
  .star-input span:hover{transform:scale(1.15);}
  .stars-readonly{color:#f59e0b;font-size:16px;letter-spacing:2px;}

  .confirm-box{
    background:var(--success-bg);border:1px solid #a7f3d0;color:var(--success-text);
    border-radius:var(--radius-md);padding:18px 20px;display:flex;gap:12px;align-items:flex-start;font-weight:700;font-size:13.5px;
  }

  /* ---------- Toast ---------- */
  #toast-container{position:fixed;bottom:26px;right:26px;z-index:400;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
  .toast{
    background:var(--slate-900);color:#fff;padding:13px 20px;border-radius:var(--radius-sm);
    font-weight:700;font-size:13.5px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;
    max-width:340px;opacity:0;transform:translateY(10px);transition:opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast .icon{color:#34d399;}

  /* ---------- Restart button ---------- */
  .restart-btn{
    position:fixed;bottom:24px;left:24px;z-index:300;
    background:#fff;color:var(--slate-700);border:1.5px solid var(--slate-300);
    padding:11px 18px;border-radius:999px;font-family:inherit;font-weight:800;font-size:13px;
    cursor:pointer;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:8px;
    transition:all 0.15s ease;
  }
  .restart-btn:hover{background:var(--slate-900);color:#fff;border-color:var(--slate-900);transform:translateY(-1px);}

  .helper-note{font-size:12px;color:var(--slate-400);font-weight:700;margin-top:4px;}

  @media (max-width:768px){
    .browser-shell{margin:0;border-radius:0;}
    .app-header{padding:14px 16px;}
    .app-body{padding:18px 16px 80px;}
    .field-row{grid-template-columns:1fr;}
    .role-pill{padding:8px 13px;font-size:13px;}
    .app-logo span.tag{display:none;}
    .grid-cards{grid-template-columns:1fr;}
    .restart-btn span.label{display:none;}
    .browser-url{max-width:none;}
  }
</style>
</head>
<body>

<div class="browser-shell">
  <div class="browser-topbar">
    <div class="traffic-lights"><span class="tl-red"></span><span class="tl-yellow"></span><span class="tl-green"></span></div>
    <div class="browser-url"><span class="lock">&#128274;</span><b>prolance.app</b>&nbsp;/painel</div>
  </div>

  <div class="app-header">
    <div class="app-logo">
      <div class="mark">PL</div>
      ProLance
      <span class="tag">Fase 1</span>
    </div>
    <div class="role-switcher" id="role-switcher">
      <button class="role-pill" data-action="switch-role" data-role="cliente">Cliente</button>
      <button class="role-pill" data-action="switch-role" data-role="prestador">Prestador</button>
      <button class="role-pill" data-action="switch-role" data-role="admin">Admin</button>
    </div>

/* ============================================================

   ============================================================ */
function esc(str){
  return String(str==null?"":str).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function findProjeto(id){
  for(var i=0;i<state.projetos.length;i++){ if(state.projetos[i].id===id) return state.projetos[i]; }
  return null;
}
function statusClass(status){
  return {
    "Aberto":"badge-aberto",
    "Proposta Aceita":"badge-proposta-aceita",
    "Em Andamento":"badge-em-andamento",
    "Concluido":"badge-concluido"
  }[status] || "badge-aberto";
}
function avatarHtml(nome, iniciais, size){
  var cls = size==="lg" ? "avatar avatar-lg" : (size==="sm" ? "avatar avatar-sm" : "avatar");
  return '<div class="'+cls+'" style="background:'+avatarColor(nome)+'">'+esc(iniciais)+'</div>';
}
function proposalCountLabel(p){
  var n = p.propostas.length;
  return n + (n===1 ? " proposta recebida" : " propostas recebidas");
}
function showToast(msg){
  var container = document.getElementById("toast-container");
  var el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = ICONS.check + '<span>'+esc(msg)+'</span>';
  container.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add("show"); });
  setTimeout(function(){
    el.classList.remove("show");
    setTimeout(function(){ el.remove(); }, 300);
  }, 3200);
}
function openModal(id){
  document.getElementById(id).classList.add("show");
}
function closeModal(id){
  document.getElementById(id).classList.remove("show");
  var form = document.getElementById(id).querySelector("form");
  if(form) form.reset();
}

    var accepted = p.propostas.filter(function(x){return x.status==="Aceita";})[0];
    html += '<div class="section-block">'+
      '<h3>'+ICONS.chat+' Conversa com '+(accepted?esc(accepted.prestador):"prestador")+'</h3>'+
      renderChatPanel(p, "cliente")+
    '</div>';
  }

  // Avaliacao
  if(p.status==="Concluido"){
    html += '<div class="section-block"><h3>&#9733; Avaliacao</h3>';
    if(p.avaliacao){
      html += '<div class="confirm-box">'+ICONS.check+'<div><div style="margin-bottom:4px;">Avaliacao enviada - obrigado pelo feedback!</div>'+
        '<div class="stars-readonly">'+starsDisplay(p.avaliacao.estrelas)+'</div>'+
        '<div style="margin-top:6px;font-weight:600;color:var(--success-text);">"'+esc(p.avaliacao.comentario)+'"</div></div></div>';
    } else {
      html += '<form data-form="avaliacao" data-projeto="'+p.id+'">'+
        '<div class="field"><label>Sua avaliacao</label>'+
        '<div class="star-input" id="star-input">'+
          [1,2,3,4,5].map(function(n){ return '<span data-star="'+n+'" data-action="set-star">&#9733;</span>'; }).join('')+
        '</div>'+
        '<input type="hidden" name="estrelas" id="estrelas-hidden" value="0">'+
        '</div>'+
        '<div class="field"><label>Comentario</label><textarea name="comentario" required placeholder="Conte como foi a experiencia com este prestador..."></textarea></div>'+
        '<button type="submit" class="btn btn-primary">Enviar Avaliacao</button>'+
      '</form>';
    }
    html += '</div>';
  }

  return html;
}

function starsDisplay(n){
  var s='';
  for(var i=1;i<=5;i++){ s += i<=n ? '&#9733;' : '&#9734;'; }
  return s;
}

function renderChatPanel(p, viewerRole){
  var html = '<div class="chat-panel">';
  html += '<div class="chat-messages" id="chat-messages-'+p.id+'">';
  if(p.chat.length===0){
    html += '<div style="text-align:center;color:var(--slate-400);font-weight:700;font-size:13px;padding:20px 0;">Nenhuma mensagem ainda. Envie a primeira!</div>';
  }
  p.chat.forEach(function(m){
    var mine = m.from === viewerRole;
    html += '<div class="chat-bubble-row '+(mine?'mine':'')+'">'+
      avatarHtml(m.autor, m.autor.split(" ").map(function(w){return w[0];}).slice(0,2).join("").toUpperCase(), "sm")+
      '<div><div class="chat-bubble">'+esc(m.texto)+'</div><div class="chat-time">'+esc(m.hora)+'</div></div>'+
    '</div>';
  });
  html += '</div>';
  html += '<form class="chat-input-row" data-form="chat" data-projeto="'+p.id+'" data-viewer="'+viewerRole+'">'+
    '<input type="text" name="mensagem" placeholder="Escreva uma mensagem..." required autocomplete="off">'+
    '<button type="submit" class="btn btn-primary btn-sm">'+ICONS.send+'</button>'+
  '</form>';
  html += '</div>';
  return html;
}

/* ============================================================
   RENDER: PRESTADOR
   ============================================================ */
function renderPrestador(){
  var root = document.getElementById("view-prestador");
  var html = '';
  html += '<div class="view-header">'+
    '<div><div class="view-title">Area do Prestador</div>'+
    '<div class="view-subtitle">Logado como '+esc(VOCE_PRESTADOR)+' - encontre projetos e acompanhe suas propostas</div></div>'+
  '</div>';
  html += '<div class="subtabs">'+
    '<button class="subtab '+(ui.prestadorTab==="disponiveis"?"active":"")+'" data-action="prestador-tab" data-tab="disponiveis">'+ICONS.briefcase+' Projetos Disponiveis</button>'+
    '<button class="subtab '+(ui.prestadorTab==="minhas"?"active":"")+'" data-action="prestador-tab" data-tab="minhas">'+ICONS.list+' Minhas Propostas</button>'+
  '</div>';

  if(ui.prestadorTab==="disponiveis"){
    html += renderPrestadorDisponiveis();
  } else {
    html += renderPrestadorMinhas();
  }
  root.innerHTML = html;
}

function renderPrestadorDisponiveis(){
  var html = '';
  html += '<div class="filter-chips" id="prestador-filtros">';
  html += '<button class="chip '+(ui.prestadorFiltro==="Todos"?"active":"")+'" data-action="filtrar-categoria" data-cat="Todos">Todos</button>';
  state.categorias.forEach(function(c){
    html += '<button class="chip '+(ui.prestadorFiltro===c?"active":"")+'" data-action="filtrar-categoria" data-cat="'+esc(c)+'">'+esc(c)+'</button>';
  });
  html += '</div>';

  var abertos = state.projetos.filter(function(p){ return p.status==="Aberto"; });
  if(ui.prestadorFiltro !== "Todos"){
    abertos = abertos.filter(function(p){ return p.categoria === ui.prestadorFiltro; });
  }

  if(abertos.length===0){
    html += '<div class="empty-state">'+ICONS.filter.replace('icon','icon icon-lg')+'<p>Nenhum projeto aberto nesta categoria no momento.</p></div>';
    return html;
  }

  html += '<div class="grid-cards">';
  abertos.forEach(function(p){
    var jaEnviou = p.propostas.some(function(pr){ return pr.prestadorId === "voce"; });
    html += '<div class="card">'+
      '<div class="card-top"><div class="card-title">'+esc(p.titulo)+'</div></div>'+
      '<div class="card-desc">'+esc(p.descricao)+'</div>'+
      '<div class="card-meta">'+
        '<span class="category-tag">'+esc(p.categoria)+'</span>'+
        '<span class="meta-chip">'+ICONS.calendar+' '+esc(p.prazo)+'</span>'+
      '</div>'+
      '<div class="card-footer">'+
        '<span style="font-size:12.5px;color:var(--slate-500);font-weight:700;">'+esc(p.orcamento)+'</span>'+
        (jaEnviou
          ? '<span class="badge badge-enviada">Proposta enviada</span>'
          : '<button class="btn btn-primary btn-sm" data-action="open-proposta-modal" data-id="'+p.id+'">'+ICONS.send+' Enviar Proposta</button>')+
      '</div>'+
    '</div>';
  });
  html += '</div>';
  return html;
}

function renderPrestadorMinhas(){
  var minhas = [];
  state.projetos.forEach(function(p){
    p.propostas.forEach(function(prop){
      if(prop.prestadorId === "voce"){
        minhas.push({ projeto:p, proposta:prop });
      }
    });
  });

  if(ui.prestadorChatId){
    var pj = findProjeto(ui.prestadorChatId);
    if(pj){
      var html = '<button class="back-link" data-action="fechar-chat-prestador">'+ICONS.arrowLeft+' Voltar para Minhas Propostas</button>';
      html += '<div class="section-block"><h3>'+ICONS.chat+' Conversa - '+esc(pj.titulo)+'</h3>'+renderChatPanel(pj, "prestador")+'</div>';
      return html;
    }
  }

  if(minhas.length===0){
    return '<div class="empty-state">'+ICONS.list.replace('icon','icon icon-lg')+'<p>Voce ainda nao enviou nenhuma proposta.</p></div>';
  }

  var html = '<div class="table-wrap"><table><thead><tr>'+
    '<th>Projeto</th><th>Categoria</th><th>Prazo proposto</th><th>Status</th><th></th>'+
    '</tr></thead><tbody>';
  minhas.forEach(function(item){
    var st = item.proposta.status;
    var badgeCls = st==="Aceita" ? "badge-concluido" : (st==="Recusada" ? "badge-recusada" : "badge-enviada");
    html += '<tr>'+
      '<td style="font-weight:800;color:var(--slate-900);">'+esc(item.projeto.titulo)+'</td>'+
      '<td><span class="category-tag">'+esc(item.projeto.categoria)+'</span></td>'+
      '<td>'+esc(item.proposta.prazoProposto)+'</td>'+
      '<td><span class="badge '+badgeCls+'"><span class="badge-dot"></span>'+esc(st)+'</span></td>'+
      '<td>'+(st==="Aceita" ? '<button class="btn btn-secondary btn-sm" data-action="abrir-chat-prestador" data-id="'+item.projeto.id+'">'+ICONS.chat+' Abrir Chat</button>' : '')+'</td>'+
    '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

/* ============================================================
   RENDER: ADMIN
   ============================================================ */
function renderAdmin(){
  var root = document.getElementById("view-admin");
  var html = '';
  html += '<div class="view-header">'+
    '<div><div class="view-title">Painel Administrativo</div>'+
    '<div class="view-subtitle">Configure categorias, gerencie usuarios e acompanhe todos os projetos</div></div>'+
  '</div>';
  html += '<div class="subtabs">'+
    '<button class="subtab '+(ui.adminTab==="categorias"?"active":"")+'" data-action="admin-tab" data-tab="categorias">'+ICONS.layers+' Categorias</button>'+
    '<button class="subtab '+(ui.adminTab==="usuarios"?"active":"")+'" data-action="admin-tab" data-tab="usuarios">'+ICONS.users+' Usuarios</button>'+
    '<button class="subtab '+(ui.adminTab==="projetos"?"active":"")+'" data-action="admin-tab" data-tab="projetos">'+ICONS.briefcase+' Projetos e Propostas</button>'+
  '</div>';

  if(ui.adminTab==="categorias") html += renderAdminCategorias();
  else if(ui.adminTab==="usuarios") html += renderAdminUsuarios();
  else html += renderAdminProjetos();

  root.innerHTML = html;
}

function renderAdminCategorias(){
  var html = '<div class="section-block">'+
    '<h3>'+ICONS.layers+' Categorias da plataforma</h3>'+
    '<p class="view-subtitle" style="margin:-8px 0 16px;">Estas categorias sao placeholders genericos. Adicione, edite ou remova aqui e o resultado aparece na hora nos filtros do Prestador - sem precisar mexer em codigo. Isso e o que permite adaptar a ProLance para qualquer nicho.</p>'+
    '<div class="categoria-list" id="categoria-list">';
  state.categorias.forEach(function(c){
    html += '<div class="categoria-pill">'+esc(c)+
      '<button data-action="remover-categoria" data-cat="'+esc(c)+'" title="Remover categoria">'+ICONS.x+'</button></div>';
  });
  html += '</div>';
  html += '<form class="add-categoria-row" data-form="add-categoria">'+
    '<input type="text" name="categoria" placeholder="Nome da nova categoria (ex: Fotografia de Eventos)" required>'+
    '<button type="submit" class="btn btn-primary">'+ICONS.plus+' Adicionar</button>'+
  '</form>';
  html += '</div>';
  return html;
}

function renderAdminUsuarios(){
  var html = '<div class="table-wrap"><table><thead><tr>'+
    '<th>Nome</th><th>Tipo</th><th>Data de cadastro</th><th>Status</th><th></th>'+
    '</tr></thead><tbody>';
  state.usuarios.forEach(function(u, idx){
    html += '<tr>'+
      '<td class="cell-user">'+avatarHtml(u.nome, u.nome.split(" ").map(function(w){return w[0];}).slice(0,2).join("").toUpperCase(), "sm")+esc(u.nome)+'</td>'+
      '<td>'+esc(u.tipo)+'</td>'+
      '<td>'+esc(u.data)+'</td>'+
      '<td><span class="badge '+(u.suspenso?"badge-suspenso":"badge-ativo")+'"><span class="badge-dot"></span>'+(u.suspenso?"Suspenso":"Ativo")+'</span></td>'+
      '<td><button class="btn btn-sm '+(u.suspenso?"btn-success":"btn-danger")+'" data-action="toggle-usuario" data-idx="'+idx+'">'+(u.suspenso?"Reativar":"Suspender")+'</button></td>'+
    '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function renderAdminProjetos(){
  var html = '<div class="table-wrap"><table><thead><tr>'+
    '<th>Projeto</th><th>Categoria</th><th>Status</th><th>Propostas</th><th>Orcamento</th>'+
    '</tr></thead><tbody>';
  state.projetos.forEach(function(p){
    html += '<tr>'+
      '<td style="font-weight:800;color:var(--slate-900);">'+esc(p.titulo)+'</td>'+
      '<td><span class="category-tag">'+esc(p.categoria)+'</span></td>'+
      '<td><span class="badge '+statusClass(p.status)+'"><span class="badge-dot"></span>'+esc(p.status)+'</span></td>'+
      '<td>'+p.propostas.length+'</td>'+
      '<td>'+esc(p.orcamento)+'</td>'+
    '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

/* ============================================================
   RENDER ALL / helper for select options
   ============================================================ */
function populateCategoriaSelect(){
  var sel = document.getElementById("select-categoria-publicar");
  sel.innerHTML = state.categorias.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('');
}

function renderAll(){
  renderRoleSwitcher();
  renderCliente();
  renderPrestador();
  renderAdmin();
  populateCategoriaSelect();
}

/* ============================================================
   ACTIONS
   ============================================================ */
function scrollChatToBottom(projetoId){
  var el = document.getElementById("chat-messages-"+projetoId);
  if(el) el.scrollTop = el.scrollHeight;
}

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");
  if(!t) return;
  var action = t.dataset.action;

  if(action==="switch-role"){
    ui.role = t.dataset.role;
    renderRoleSwitcher();
  }
  else if(action==="open-publicar-modal"){
    openModal("modal-publicar");
  }
  else if(action==="close-modal"){
    closeModal(t.dataset.modal);
  }
  else if(action==="open-cliente-detail"){
    ui.clienteSelectedId = parseInt(t.dataset.id, 10);
    renderCliente();
  }
  else if(action==="back-to-cliente-lista"){
    ui.clienteSelectedId = null;
    renderCliente();
  }
  else if(action==="aceitar-proposta"){
    var pid = parseInt(t.dataset.projeto,10);
    var propId = parseInt(t.dataset.proposta,10);
    var proj = findProjeto(pid);
    if(proj){
      proj.propostas.forEach(function(pr){
        pr.status = (pr.id===propId) ? "Aceita" : "Recusada";
      });
      proj.status = "Proposta Aceita";
      if(proj.chat.length===0){
        var acc = proj.propostas.filter(function(x){return x.id===propId;})[0];
        proj.chat.push({from:"prestador", autor:acc.prestador, texto:"Obrigado por aceitar minha proposta! Vamos comecar assim que possivel.", hora:"agora"});
      }
      showToast("Proposta aceita - chat liberado com o prestador");
      renderCliente();
      renderPrestador();
      renderAdmin();
    }
  }
  else if(action==="marcar-concluido"){
    var pid2 = parseInt(t.dataset.id,10);
    var proj2 = findProjeto(pid2);
    if(proj2){
      proj2.status = "Concluido";
      showToast("Projeto marcado como concluido");
      renderCliente();
      renderAdmin();
    }
  }
  else if(action==="set-star"){
    var n = parseInt(t.dataset.star,10);
    ui.ratingDraft = n;
    document.getElementById("estrelas-hidden").value = n;
    document.querySelectorAll("#star-input span").forEach(function(s){
      s.classList.toggle("filled", parseInt(s.dataset.star,10) <= n);
    });
  }
  else if(action==="prestador-tab"){
    ui.prestadorTab = t.dataset.tab;
    ui.prestadorChatId = null;
    renderPrestador();
  }
  else if(action==="filtrar-categoria"){
    ui.prestadorFiltro = t.dataset.cat;
    renderPrestador();
  }
  else if(action==="open-proposta-modal"){
    var pid3 = t.dataset.id;
    var proj3 = findProjeto(parseInt(pid3,10));
    document.querySelector('#modal-proposta input[name="projetoId"]').value = pid3;
    document.getElementById("proposta-projeto-titulo").textContent = "Projeto: " + (proj3 ? proj3.titulo : "");
    openModal("modal-proposta");
  }
  else if(action==="abrir-chat-prestador"){
    ui.prestadorChatId = parseInt(t.dataset.id,10);
    renderPrestador();
    scrollChatToBottom(ui.prestadorChatId);
  }
  else if(action==="fechar-chat-prestador"){
    ui.prestadorChatId = null;
    renderPrestador();
  }
  else if(action==="admin-tab"){
    ui.adminTab = t.dataset.tab;
    renderAdmin();
  }
  else if(action==="remover-categoria"){
    var cat = t.dataset.cat;
    state.categorias = state.categorias.filter(function(c){ return c !== cat; });
    if(ui.prestadorFiltro === cat) ui.prestadorFiltro = "Todos";
    showToast('Categoria "'+cat+'" removida');
    renderAdmin();
    renderPrestador();
    populateCategoriaSelect();
  }
  else if(action==="toggle-usuario"){
    var idx = parseInt(t.dataset.idx,10);
    state.usuarios[idx].suspenso = !state.usuarios[idx].suspenso;
    showToast(state.usuarios[idx].suspenso ? "Usuario suspenso" : "Usuario reativado");
    renderAdmin();
  }
  else if(action==="reiniciar"){
    reiniciarDemo();
  }
});

document.addEventListener("submit", function(e){
  var form = e.target.closest("[data-form]");
  if(!form) return;
  e.preventDefault();
  var type = form.dataset.form;

  if(type==="publicar-projeto"){
    var fd = new FormData(form);
    var novo = {
      id: nextIds.projeto++,
      titulo: fd.get("titulo").trim(),
      descricao: fd.get("descricao").trim(),
      categoria: fd.get("categoria"),
      orcamento: fd.get("orcamento").trim(),
      prazo: fd.get("prazo").trim(),
      status:"Aberto",
      propostas:[],
      chat:[],
      avaliacao:null
    };
    state.projetos.unshift(novo);
    closeModal("modal-publicar");
    showToast("Projeto publicado com sucesso");
    renderCliente();
    renderPrestador();
    renderAdmin();
  }
  else if(type==="enviar-proposta"){
    var fd2 = new FormData(form);
    var projetoId = parseInt(fd2.get("projetoId"),10);
    var proj = findProjeto(projetoId);
    if(proj){
      proj.propostas.push({
        id: nextIds.proposta++,
        prestador: VOCE_PRESTADOR,
        iniciais: VOCE_INICIAIS,
        prestadorId:"voce",
        prazoProposto: fd2.get("prazoProposto").trim(),
        mensagem: fd2.get("mensagem").trim(),
        status:"Enviada"
      });
      closeModal("modal-proposta");
      showToast("Proposta enviada ao cliente");
      renderPrestador();
      renderCliente();
      renderAdmin();
    }
  }
  else if(type==="chat"){
    var fd3 = new FormData(form);
    var pid = parseInt(form.dataset.projeto,10);
    var viewer = form.dataset.viewer;
    var proj4 = findProjeto(pid);
    if(proj4){
      var autorNome = viewer==="cliente" ? CLIENTE_NOME : (proj4.propostas.filter(function(x){return x.status==="Aceita";})[0]||{prestador:VOCE_PRESTADOR}).prestador;
      var now = new Date();
      var hora = (now.getHours()<10?"0":"")+now.getHours()+":"+(now.getMinutes()<10?"0":"")+now.getMinutes();
      proj4.chat.push({ from: viewer, autor: autorNome, texto: fd3.get("mensagem").trim(), hora: hora });
      form.reset();
      if(viewer==="cliente"){ renderCliente(); scrollChatToBottom(pid); }
      else { renderPrestador(); scrollChatToBottom(pid); }
    }
  }
  else if(type==="avaliacao"){
    var fd4 = new FormData(form);
    var pid2 = parseInt(form.dataset.projeto,10);
    var proj5 = findProjeto(pid2);
    var estrelas = parseInt(fd4.get("estrelas"),10) || ui.ratingDraft || 5;
    if(proj5){
      proj5.avaliacao = { estrelas: estrelas, comentario: fd4.get("comentario").trim() };
      showToast("Avaliacao enviada - obrigado pelo feedback");
      ui.ratingDraft = 0;
      renderCliente();
    }
  }
  else if(type==="add-categoria"){
    var fd5 = new FormData(form);
    var nome = fd5.get("categoria").trim();
    if(nome && state.categorias.indexOf(nome) === -1){
      state.categorias.push(nome);
      showToast("Categoria adicionada - ja disponivel para prestadores");
      form.reset();
      renderAdmin();
      renderPrestador();
      populateCategoriaSelect();
    } else if(nome){
      showToast("Essa categoria ja existe");
      form.reset();
    }
  }
});

document.querySelectorAll(".modal-overlay").forEach(function(overlay){
  overlay.addEventListener("click", function(e){
    if(e.target === overlay){
      overlay.classList.remove("show");
      var form = overlay.querySelector("form");
      if(form) form.reset();
    }
  });
});

/* ============================================================
   RESTART
   ============================================================ */
function reiniciarDemo(){
  state = freshState();
  nextIds = { projeto:6, proposta:13 };
  ui = {
    role:"cliente",
    clienteSelectedId:null,
    prestadorTab:"disponiveis",
    prestadorFiltro:"Todos",
    prestadorSelectedId:null,
    prestadorChatId:null,
    adminTab:"categorias",
    ratingDraft:0
  };
  document.querySelectorAll(".modal-overlay").forEach(function(m){ m.classList.remove("show"); });
  document.querySelectorAll(".modal-overlay form").forEach(function(f){ f.reset(); });
  renderAll();
  showToast("Demo reiniciada - dados originais restaurados");
}

/* ============================================================
   INIT
   ============================================================ */
renderAll();

})();
</script>
