<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduBot - Chatbot Educacional</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #eff6ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 460px;
    }

    .app-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
      box-shadow: 0 4px 14px rgba(30, 64, 175, 0.3);
    }

    .app-header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #1e40af;
    }

    .app-header p {
      color: #64748b;
      font-size: 13px;
      font-weight: 500;
    }

    .subject-chips {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 14px;
    }

    .chip {
      padding: 5px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .chip.active {
      background: #1e40af;
      color: white;
      box-shadow: 0 2px 8px rgba(30, 64, 175, 0.25);
    }

    .chip:not(.active) {
      background: white;
      color: #475569;
      border-color: #cbd5e1;
    }

    .chip:hover:not(.active) {
      border-color: #1e40af;
      color: #1e40af;
    }

    .chat-window {
      background: white;
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(30, 64, 175, 0.14), 0 4px 16px rgba(0,0,0,0.06);
      overflow: hidden;
      height: 530px;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #1d4ed8 100%);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bot-avatar {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.18);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: white;
      border: 2px solid rgba(255,255,255,0.3);
      flex-shrink: 0;
    }

    .chat-header-info { flex: 1; }

    .chat-header-info h3 {
      color: white;
      font-size: 15px;
      font-weight: 800;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #93c5fd;
      font-size: 11px;
      font-weight: 600;
      margin-top: 2px;
    }

    .status-dot-live {
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .header-badge {
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.25);
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .messages-area::-webkit-scrollbar { width: 4px; }
    .messages-area::-webkit-scrollbar-track { background: transparent; }
    .messages-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .message {
      display: flex;
      gap: 7px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.35s ease;
    }

    .message.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg-avatar.bot { background: #dbeafe; color: #1e40af; }
    .msg-avatar.user { background: #dcfce7; color: #15803d; }

    .msg-bubble {
      max-width: 80%;
      padding: 11px 14px;
      border-radius: 18px;
      font-size: 13.5px;
      line-height: 1.65;
    }

    .message.bot .msg-bubble {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
      color: #1e293b;
    }

    .message.user .msg-bubble {
      background: linear-gradient(135deg, #1e40af, #1d4ed8);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 8px rgba(30, 64, 175, 0.2);
    }

    .subject-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #eff6ff;
      color: #1e40af;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .socratic-box {
      background: #fefce8;
      border: 1px solid #fde68a;
      border-left: 4px solid #f59e0b;
      border-radius: 0 10px 10px 0;
      padding: 10px 12px;
      margin-top: 8px;
      font-size: 13px;
      color: #78350f;
    }

    .socratic-label {
      font-weight: 800;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #b45309;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .answer-buttons {
      display: flex;
      gap: 7px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .answer-btn {
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      font-family: 'Nunito', sans-serif;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .answer-btn.yes { background: #1e40af; color: white; }
    .answer-btn.no { background: #e0e7ff; color: #3730a3; }
    .answer-btn:hover { opacity: 0.88; transform: scale(1.04); }

    .step-block {
      background: #f0f9ff;
      border-left: 3px solid #1e40af;
      border-radius: 0 8px 8px 0;
      padding: 9px 11px;
      margin: 6px 0;
    }

    .step-label {
      font-weight: 800;
      color: #1e40af;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .formula-box {
      background: white;
      border: 1px solid #bfdbfe;
      border-radius: 7px;
      padding: 7px 10px;
      font-family: 'Courier New', monospace;
      font-size: 12.5px;
      color: #1e40af;
      font-weight: 700;
      text-align: center;
      margin: 5px 0;
      letter-spacing: 0.3px;
    }

    .step-text {
      font-size: 12.5px;
      color: #475569;
      margin-top: 3px;
      line-height: 1.5;
    }

    .verify-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .verify-chip {
      background: #dcfce7;
      color: #15803d;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 10px;
    }

    .challenge-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 8px;
      font-size: 12.5px;
      color: #1e293b;
    }

    .challenge-label {
      font-weight: 800;
      color: #1e40af;
      font-size: 10px;
      text-transform: uppercase;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .typing {
      display: flex;
      gap: 7px;
      align-items: flex-end;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .typing.visible { opacity: 1; }

    .typing-dots {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 11px 14px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: #94a3b8;
      border-radius: 50%;
      animation: bounce 1.2s ease infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    .chat-input {
      border-top: 1px solid #e2e8f0;
      padding: 12px 14px;
      display: flex;
      gap: 9px;
      align-items: center;
      background: white;
    }

    .input-field {
      flex: 1;
      border: 2px solid #e2e8f0;
      border-radius: 24px;
      padding: 9px 15px;
      font-family: 'Nunito', sans-serif;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s;
      color: #1e293b;
      background: #f8fafc;
    }

    .input-field:focus {
      border-color: #1e40af;
      background: white;
    }

    .input-field::placeholder { color: #94a3b8; }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e40af, #1d4ed8);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(30, 64, 175, 0.3);
    }

    .send-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(30, 64, 175, 0.4);
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding: 0 4px;
    }

    .powered-tag {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .restart-btn {
      background: transparent;
      border: 2px solid #cbd5e1;
      color: #64748b;
      padding: 6px 14px;
      border-radius: 18px;
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .restart-btn:hover {
      border-color: #1e40af;
      color: #1e40af;
      background: #eff6ff;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="app-header">
    <div class="logo-row">
      <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
      <h1>EduBot</h1>
    </div>
    <p>Seu professor virtual disponivel 24 horas</p>
  </div>

  <div class="subject-chips">
    <div class="chip active" onclick="selectChip(this)">
      <i class="fa-solid fa-square-root-variable"></i> Matematica
    </div>
    <div class="chip" onclick="selectChip(this)">
      <i class="fa-solid fa-flask"></i> Ciencias
    </div>
    <div class="chip" onclick="selectChip(this)">
      <i class="fa-solid fa-landmark"></i> Historia
    </div>
    <div class="chip" onclick="selectChip(this)">
      <i class="fa-solid fa-book-open"></i> Portugues
    </div>
  </div>

  <div class="chat-window">
    <div class="chat-header">
      <div class="bot-avatar"><i class="fa-solid fa-robot"></i></div>
      <div class="chat-header-info">
        <h3>EduBot</h3>
        <div class="status-badge">
          <div class="status-dot-live"></div>
          Online agora
        </div>
      </div>
      <div class="header-badge"><i class="fa-solid fa-brain"></i> IA Pedagogica</div>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <div class="chat-input">
      <input class="input-field" type="text" placeholder="Escreva sua duvida aqui..." id="userInput">
      <button class="send-btn" onclick="sendMessage()">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="powered-tag">
      <i class="fa-solid fa-microchip"></i> Explicacoes passo a passo por IA
    </div>
    <button class="restart-btn" onclick="restartDemo()">
      <i class="fa-solid fa-rotate-right"></i> Reiniciar
    </button>
  </div>
</div>

<script>
const CONVERSATION = [
  {
    role: 'bot',
    delay: 500,
    html: `<div class="subject-tag"><i class="fa-solid fa-square-root-variable"></i> Matematica</div><br>
Ola! Sou o EduBot. Pode me perguntar qualquer coisa das suas atividades escolares.<br><br>
Nao vou so dar a resposta certa. Vou explicar o raciocinio passo a passo para voce entender de verdade.`
  },
  {
    role: 'user',
    delay: 2000,
    html: `Como resolvo a equacao x² - 5x + 6 = 0?`
  },
  {
    role: 'bot',
    delay: 3200,
    html: `<div class="socratic-box">
  <div class="socratic-label"><i class="fa-solid fa-lightbulb"></i> Questao guiada</div>
  Antes de resolvermos juntos: voce se lembra o que representa o <strong>delta (Δ)</strong> na formula de Bhaskara?<br>
  Isso vai ajudar voce a entender cada passo sem decorar.
</div>`,
    hasButtons: true
  }
];

const STEP_YES = `<div class="subject-tag" style="background:#dcfce7;color:#15803d;"><i class="fa-solid fa-check"></i> Otimo</div><br>
Entao vamos resolver <strong>x² - 5x + 6 = 0</strong> juntos.

<div class="step-block">
  <div class="step-label"><i class="fa-solid fa-circle-1"></i> Passo 1 - Identificar os coeficientes</div>
  <div class="formula-box">a = 1 &nbsp;&nbsp;&nbsp; b = -5 &nbsp;&nbsp;&nbsp; c = 6</div>
  <div class="step-text">Cada numero antes do x² do x e do numero solto da equacao.</div>
</div>

<div class="step-block">
  <div class="step-label"><i class="fa-solid fa-circle-2"></i> Passo 2 - Calcular o delta</div>
  <div class="formula-box">Delta = b² - 4ac = (-5)² - 4(1)(6) = 25 - 24 = 1</div>
  <div class="step-text">Delta positivo significa duas raizes reais. Se fosse negativo nao teria solucao real.</div>
</div>

<div class="step-block">
  <div class="step-label"><i class="fa-solid fa-circle-3"></i> Passo 3 - Formula de Bhaskara</div>
  <div class="formula-box">x = (-b +- raiz(Delta)) / 2a = (5 +- 1) / 2</div>
  <div class="step-text">Calculamos duas vezes: uma com + e outra com -.</div>
</div>

<div class="step-block">
  <div class="step-label"><i class="fa-solid fa-circle-4"></i> Passo 4 - As raizes</div>
  <div class="formula-box">x1 = (5 + 1) / 2 = 3 &nbsp;&nbsp;&nbsp;&nbsp; x2 = (5 - 1) / 2 = 2</div>
  <div class="verify-row">
    <div class="verify-chip"><i class="fa-solid fa-check"></i> 3 x 2 = 6</div>
    <div class="verify-chip"><i class="fa-solid fa-check"></i> 3 + 2 = 5</div>
  </div>
</div>

<div class="challenge-box">
  <div class="challenge-label"><i class="fa-solid fa-dumbbell"></i> Seu turno</div>
  Agora tente resolver <strong>x² - 7x + 10 = 0</strong> usando esses mesmos passos. Me mostra o que voce encontrou!
</div>`;

const STEP_NO = `Sem problema. Vou explicar do zero antes de resolver.<br><br>
<div class="step-block">
  <div class="step-label"><i class="fa-solid fa-question-circle"></i> O que e o delta?</div>
  <div class="formula-box">Delta = b² - 4ac</div>
  <div class="step-text">
    Delta nos diz quantas solucoes a equacao tem:<br>
    Delta maior que 0 = duas solucoes<br>
    Delta igual a 0 = uma solucao<br>
    Delta menor que 0 = nenhuma solucao real
  </div>
</div>
Agora com isso em mente vamos resolver sua equacao passo a passo...`;

let phase = 0;
let area = document.getElementById('messagesArea');

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  const av = document.createElement('div');
  av.className = 'msg-avatar bot';
  av.innerHTML = '<i class="fa-solid fa-robot"></i>';
  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';
  div.appendChild(av);
  div.appendChild(dots);
  area.appendChild(div);
  setTimeout(() => div.classList.add('visible'), 30);
  area.scrollTop = area.scrollHeight;
  return div;
}

function addMessage(role, html, hasButtons) {
  const div = document.createElement('div');
  div.className = 'message ' + role;
  const av = document.createElement('div');
  av.className = 'msg-avatar ' + role;
  av.innerHTML = role === 'bot'
    ? '<i class="fa-solid fa-robot"></i>'
    : '<i class="fa-solid fa-user-graduate"></i>';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = html;

  if (hasButtons) {
    const btns = document.createElement('div');
    btns.className = 'answer-buttons';
    btns.innerHTML = `
      <button class="answer-btn yes" onclick="chooseYes()"><i class="fa-solid fa-check"></i> Sim, lembro</button>
      <button class="answer-btn no" onclick="chooseNo()"><i class="fa-solid fa-circle-question"></i> Nao, me explica</button>`;
    bubble.appendChild(btns);
  }

  if (role === 'bot') { div.appendChild(av); div.appendChild(bubble); }
  else { div.appendChild(bubble); div.appendChild(av); }
  area.appendChild(div);
  setTimeout(() => div.classList.add('visible'), 40);
  area.scrollTop = area.scrollHeight;
  return div;
}

function showBotMessage(html, hasButtons, callback) {
  const typing = showTyping();
  const duration = 900 + Math.min(html.length * 1.2, 1200);
  setTimeout(() => {
    typing.remove();
    addMessage('bot', html, hasButtons);
    if (callback) callback();
  }, duration);
}

function runConversation() {
  if (phase >= CONVERSATION.length) return;
  const msg = CONVERSATION[phase];
  setTimeout(() => {
    if (msg.role === 'user') {
      addMessage('user', msg.html);
      phase++;
      runConversation();
    } else {
      showBotMessage(msg.html, msg.hasButtons, () => {
        phase++;
        if (!msg.hasButtons) runConversation();
      });
    }
  }, msg.delay || 0);
}

function chooseYes() {
  document.querySelectorAll('.answer-buttons').forEach(el => el.remove());
  addMessage('user', 'Sim, lembro do delta!');
  setTimeout(() => showBotMessage(STEP_YES), 700);
}

function chooseNo() {
  document.querySelectorAll('.answer-buttons').forEach(el => el.remove());
  addMessage('user', 'Nao lembro muito bem...');
  setTimeout(() => {
    showBotMessage(STEP_NO, false, () => {
      setTimeout(() => showBotMessage(STEP_YES), 900);
    });
  }, 700);
}

function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage('user', text);
  setTimeout(() => {
    showBotMessage(`Boa pergunta! Para explicar do jeito certo preciso saber um pouco mais sobre o que voce ja estudou sobre isso. Me conta o que a sua professora ja ensinou sobre esse tema?`);
  }, 900);
}

document.getElementById('userInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') sendMessage();
});

function selectChip(el) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

function restartDemo() {
  area.innerHTML = '';
  phase = 0;
  runConversation();
}

runConversation();
</script>
</body>
</html>
